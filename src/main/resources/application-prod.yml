server:
  port: ${SERVER_PORT:8081}
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    session:
      cookie:
        secure: ${TRADE_MODEL_SESSION_COOKIE_SECURE:true}

spring:
  flyway:
    enabled: true
    locations: classpath:db/migration

  sql:
    init:
      mode: never

  datasource:
    url: ${PROD_DATASOURCE_URL}
    username: ${PROD_DATASOURCE_USERNAME}
    password: ${PROD_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  h2:
    console:
      enabled: false

  main:
    allow-circular-references: false

logging:
  level:
    org.example.trademodel: INFO

position:
  provider:
    type: ${POSITION_PROVIDER_TYPE:BINANCE}

binance:
  api:
    base-url: ${BINANCE_API_BASE_URL:https://fapi.binance.com}
    key: ${BINANCE_API_KEY}
    secret: ${BINANCE_API_SECRET}

trade-model:
  security:
    rate-limit:
      enabled: ${TRADE_MODEL_SECURITY_RATE_LIMIT_ENABLED:true}
      requests-per-minute: ${TRADE_MODEL_SECURITY_RATE_LIMIT_RPM:120}
      window-ms: ${TRADE_MODEL_SECURITY_RATE_LIMIT_WINDOW_MS:60000}
  production:
    allow-public-bind: ${TRADE_MODEL_PRODUCTION_ALLOW_PUBLIC_BIND:false}
    scheduler-policy: ${TRADE_MODEL_PRODUCTION_SCHEDULER_POLICY:}
    scheduler-approval:
      push-recheck: ${TRADE_MODEL_PRODUCTION_SCHEDULER_APPROVAL_PUSH_RECHECK:}
      position-sync: ${TRADE_MODEL_PRODUCTION_SCHEDULER_APPROVAL_POSITION_SYNC:}
      market-data: ${TRADE_MODEL_PRODUCTION_SCHEDULER_APPROVAL_MARKET_DATA:}
      ohlcv-ingestion: ${TRADE_MODEL_PRODUCTION_SCHEDULER_APPROVAL_OHLCV_INGESTION:}
      watchlist: ${TRADE_MODEL_PRODUCTION_SCHEDULER_APPROVAL_WATCHLIST:}
      position-monitor: ${TRADE_MODEL_PRODUCTION_SCHEDULER_APPROVAL_POSITION_MONITOR:}
      analysis: ${TRADE_MODEL_PRODUCTION_SCHEDULER_APPROVAL_ANALYSIS:}
      provider-scan: ${TRADE_MODEL_PRODUCTION_SCHEDULER_APPROVAL_PROVIDER_SCAN:}
  provider-call:
    enabled: ${TRADE_MODEL_PROVIDER_CALL_ENABLED:false}
    scheduler-enabled: ${TRADE_MODEL_PROVIDER_SCAN_SCHEDULER_ENABLED:false}
    profile-escalation-enabled: ${TRADE_MODEL_PROFILE_ESCALATION_ENABLED:false}
    auto-escalation-enabled: ${TRADE_MODEL_PROVIDER_AUTO_ESCALATION_ENABLED:false}
    external-calls-enabled: ${TRADE_MODEL_PROVIDER_EXTERNAL_CALLS_ENABLED:false}
  providers:
    coinglass:
      enabled: ${TRADE_MODEL_COINGLASS_ENABLED:false}
      external-calls-enabled: ${TRADE_MODEL_COINGLASS_EXTERNAL_CALLS_ENABLED:${TRADE_MODEL_PROVIDER_EXTERNAL_CALLS_ENABLED:false}}
      api-key: ${COINGLASS_API_KEY:}
      base-url: ${COINGLASS_API_BASE_URL:https://open-api-v4.coinglass.com}
      auth-header-name: ${COINGLASS_API_AUTH_HEADER:CG-API-KEY}
      advertised-rpm: ${COINGLASS_ADVERTISED_RPM:300}
  schedulers:
    enabled: ${TRADE_MODEL_SCHEDULERS_ENABLED:false}
    push-recheck:
      enabled: ${TRADE_MODEL_PUSH_RECHECK_SCHEDULER_ENABLED:false}
    position-sync:
      enabled: ${TRADE_MODEL_POSITION_SYNC_SCHEDULER_ENABLED:false}
    position-monitor:
      enabled: ${TRADE_MODEL_POSITION_MONITOR_SCHEDULER_ENABLED:false}
    market-data:
      enabled: ${TRADE_MODEL_MARKET_DATA_SCHEDULER_ENABLED:false}
    ohlcv-ingestion:
      enabled: ${TRADE_MODEL_OHLCV_INGESTION_SCHEDULER_ENABLED:false}
      symbols: ${TRADE_MODEL_OHLCV_INGESTION_SYMBOLS:}
      timeframes: ${TRADE_MODEL_OHLCV_INGESTION_TIMEFRAMES:5m,15m,1h,4h}
      bar-limit: ${TRADE_MODEL_OHLCV_INGESTION_BAR_LIMIT:100}
      max-symbols: ${TRADE_MODEL_OHLCV_INGESTION_MAX_SYMBOLS:6}
    watchlist:
      enabled: ${TRADE_MODEL_WATCHLIST_SCHEDULER_ENABLED:false}
  analysis:
    scheduler:
      enabled: ${TRADE_MODEL_ANALYSIS_SCHEDULER_ENABLED:false}
  ohlcv:
    provider:
      primary: ${TRADE_MODEL_OHLCV_PRIMARY_PROVIDER:kraken}
      fallback: ${TRADE_MODEL_OHLCV_FALLBACK_PROVIDER:binance}
      fallback-enabled: ${TRADE_MODEL_OHLCV_FALLBACK_ENABLED:true}
    kraken:
      enabled: ${TRADE_MODEL_KRAKEN_OHLCV_ENABLED:false}
      external-calls-enabled: ${TRADE_MODEL_KRAKEN_OHLCV_EXTERNAL_CALLS_ENABLED:false}
      base-url: ${TRADE_MODEL_KRAKEN_OHLCV_BASE_URL:https://api.kraken.com}
    binance:
      enabled: ${TRADE_MODEL_BINANCE_OHLCV_ENABLED:${TRADE_MODEL_PUBLIC_OHLCV_PROVIDER_ENABLED:false}}
      external-calls-enabled: ${TRADE_MODEL_BINANCE_OHLCV_EXTERNAL_CALLS_ENABLED:${TRADE_MODEL_PUBLIC_OHLCV_EXTERNAL_CALLS_ENABLED:false}}
    public-provider:
      enabled: ${TRADE_MODEL_PUBLIC_OHLCV_PROVIDER_ENABLED:false}
      external-calls-enabled: ${TRADE_MODEL_PUBLIC_OHLCV_EXTERNAL_CALLS_ENABLED:false}
