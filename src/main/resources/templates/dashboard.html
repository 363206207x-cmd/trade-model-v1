<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- th:text 由 DashboardController 注入，修改 Controller 中 title 即可生效 -->
    <title th:text="${title}">TRINE LOGIC (V1)</title>
    <style>
        :root {
            --bg-canvas: #f5f7fa;
            --bg-surface: #ffffff;
            --bg-elevated: #f8fafc;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-subtle: #e2e8f0;
            --shadow-soft: 0 8px 28px rgba(15, 23, 42, 0.08);
            --brand-accent: #2563eb;
            --status-ok: #22c55e;
            --status-warn: #eab308;
            --status-error: #ef4444;
            --tag-bull: #16a34a;
            --tag-bear: #dc2626;
            --tag-neutral: #475569;
            --cyan-ui: #06b6d4;
            --gray-blue: #64748b;
            --orange-warn: #f97316;
            --hot-reset: #ea580c;
            --extreme: #991b1b;
        }

        [data-theme="dark"] {
            --bg-canvas: #0b1220;
            --bg-surface: #111827;
            --bg-elevated: #1a2332;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --border-subtle: #273449;
            --shadow-soft: 0 12px 34px -16px rgba(0, 0, 0, 0.55);
            --brand-accent: #60a5fa;
            --tag-bull: #4ade80;
            --tag-bear: #f87171;
            --tag-neutral: #cbd5e1;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--bg-canvas);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            font-size: 14px;
            line-height: 1.45;
            min-height: 100vh;
        }

        .top-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px 24px;
            padding: 12px 20px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-subtle);
        }
        .brand-block h1 {
            margin: 0 0 4px 0;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: var(--text-primary);
        }
        .brand-block .sub {
            margin: 0;
            font-size: 0.78rem;
            color: var(--text-secondary);
            max-width: 520px;
        }
        .top-right {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            justify-content: flex-end;
        }
        .muted { color: var(--text-secondary); font-size: 0.82rem; }
        .btn {
            border: 1px solid var(--border-subtle);
            background: var(--bg-elevated);
            color: var(--text-primary);
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 0.82rem;
            cursor: pointer;
        }
        .btn:hover { border-color: var(--brand-accent); color: var(--brand-accent); }
        select.btn { cursor: pointer; }

        .wrap { padding: 14px 18px 28px; max-width: 1680px; margin: 0 auto; }

        /* Layer 1: compact row */
        .layer1 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }
        @media (max-width: 1200px) {
            .layer1 { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 640px) {
            .layer1 { grid-template-columns: 1fr; }
        }
        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 12px 13px;
            box-shadow: var(--shadow-soft);
            min-height: 0;
        }
        .card h3 {
            margin: 0 0 9px 0;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--brand-accent);
        }
        .kv { display: flex; justify-content: space-between; gap: 8px; font-size: 0.78rem; margin-bottom: 5px; }
        .kv .k { color: var(--text-secondary); flex-shrink: 0; }
        .kv .v { color: var(--text-primary); text-align: right; word-break: break-word; }
        .provider-state.neutral { color: var(--text-secondary); }
        .provider-state.ok { color: var(--status-ok); font-weight: 600; }
        .provider-state.warn { color: var(--status-warn); font-weight: 600; }

        .hot-block {
            margin-top: 8px;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--border-subtle);
            background: rgba(234, 88, 12, 0.08);
        }
        .hot-block.active {
            border-color: var(--hot-reset);
            background: rgba(234, 88, 12, 0.18);
            box-shadow: 0 0 0 1px rgba(234, 88, 12, 0.25);
        }
        .hot-block .hot-title { font-weight: 600; font-size: 0.8rem; color: var(--hot-reset); margin-bottom: 4px; }

        .alert-line {
            font-size: 0.76rem;
            padding: 6px 8px;
            border-radius: 8px;
            border: 1px solid var(--border-subtle);
            margin-bottom: 6px;
            background: var(--bg-elevated);
        }
        .alert-line.critical { border-color: var(--extreme); background: rgba(153, 27, 27, 0.15); }
        .alert-line.hot { border-color: var(--hot-reset); }
        .alert-line.confused { border-left: 3px solid var(--status-warn); }

        /* Layer 2 */
        .layer2-head {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .layer2-head .module-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-primary);
            margin-right: auto;
        }
        .ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
        .ctl input[type="search"] {
            width: 200px;
            max-width: 100%;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-elevated);
            color: var(--text-primary);
            font-size: 0.82rem;
        }
        .sort-hint { font-size: 0.72rem; color: var(--text-secondary); margin-left: 4px; }

        /* 第二层币方块：单行横向；窄屏 overflow-x 滚动；仅 6 个由 JS slice(0,6) 保证 */
        .tiles-row {
            display: flex;
            flex-wrap: nowrap;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 6px;
            -webkit-overflow-scrolling: touch;
        }
        .tiles-row .coin-tile {
            flex: 1 1 0;
            min-width: 148px;
            max-width: 100%;
        }
        .tiles-row .card.tile-full {
            flex: 1 1 100%;
            min-width: 100%;
        }

        .coin-tile {
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 9px 9px 10px;
            background: var(--bg-elevated);
            cursor: pointer;
            transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s, background 0.15s;
            position: relative;
            min-height: 162px;
        }
        .coin-tile:hover {
            border-color: var(--brand-accent);
            transform: translateY(-1px);
        }
        .coin-tile::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 3px;
            border-radius: 12px 12px 0 0;
            background: rgba(100, 116, 139, 0.35);
        }
        .coin-tile.bias-bull {
            border-color: rgba(34, 197, 94, 0.35);
            background: linear-gradient(180deg, rgba(34, 197, 94, 0.08) 0%, var(--bg-elevated) 48%);
        }
        .coin-tile.bias-bear {
            border-color: rgba(239, 68, 68, 0.34);
            background: linear-gradient(180deg, rgba(239, 68, 68, 0.08) 0%, var(--bg-elevated) 48%);
        }
        .coin-tile.bias-neu {
            border-color: rgba(100, 116, 139, 0.34);
        }
        .coin-tile.bias-bull::before { background: rgba(22, 163, 74, 0.58); }
        .coin-tile.bias-bear::before { background: rgba(220, 38, 38, 0.58); }
        .coin-tile.bias-neu::before { background: rgba(100, 116, 139, 0.45); }
        .coin-tile.selected {
            border-color: var(--brand-accent);
            background: linear-gradient(180deg, rgba(37, 99, 235, 0.12) 0%, var(--bg-elevated) 42%);
            box-shadow: 0 0 0 1px rgba(37, 99, 235, 0.3), 0 10px 20px -14px rgba(37, 99, 235, 0.45);
            transform: translateY(-1px);
        }
        .coin-tile.selected::before { height: 4px; background: var(--brand-accent); }
        .tile-conclusion-line {
            font-size: 0.72rem;
            color: var(--text-secondary);
            line-height: 1.35;
            margin: 2px 0 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 100%;
            min-width: 0;
        }
        .coin-tile .sym {
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 4px;
            margin-bottom: 4px;
        }
        .coin-tile .price {
            font-size: 0.69rem;
            color: var(--text-secondary);
            margin: 6px 0 0;
            opacity: 0.62;
            line-height: 1.3;
        }
        .tile-mainline {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            margin-bottom: 5px;
        }
        .tile-bias {
            font-size: 1.02rem;
            font-weight: 700;
            letter-spacing: 0.01em;
        }
        .tile-bias.bull { color: var(--tag-bull); }
        .tile-bias.bear { color: var(--tag-bear); }
        .tile-bias.neu { color: var(--tag-neutral); }
        .conf-badge {
            font-size: 0.66rem;
            padding: 2px 7px;
            border-radius: 999px;
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            background: rgba(100, 116, 139, 0.12);
            white-space: nowrap;
        }
        .tile-primary {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-bottom: 6px;
        }
        .tile-tags-compact {
            margin-top: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            min-height: 22px;
        }
        .tag-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
        .mini-tag {
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            line-height: 1.25;
        }
        .mini-tag.bull { color: var(--tag-bull); border-color: rgba(34, 197, 94, 0.45); }
        .mini-tag.bear { color: var(--tag-bear); border-color: rgba(248, 113, 113, 0.45); }
        .mini-tag.neu { color: var(--tag-neutral); }
        .mini-tag.conflict {
            color: #b45309;
            border-color: rgba(217, 119, 6, 0.35);
            background: rgba(245, 158, 11, 0.12);
        }
        [data-theme="dark"] .mini-tag.conflict {
            color: #fbbf24;
            border-color: rgba(251, 191, 36, 0.35);
            background: rgba(251, 191, 36, 0.12);
        }
        .tile-del {
            position: absolute;
            top: 6px;
            right: 6px;
            font-size: 0.65rem;
            padding: 2px 6px;
            border: none;
            border-radius: 4px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
        }
        .tile-del:hover { color: var(--status-error); }

        /* suggestion colors */
        .sg-open { background: rgba(34, 197, 94, 0.2); color: #86efac; border-color: rgba(34, 197, 94, 0.4); }
        .sg-watch { background: rgba(6, 182, 212, 0.15); color: #67e8f9; border-color: rgba(6, 182, 212, 0.35); }
        .sg-care { background: rgba(234, 179, 8, 0.2); color: #fde047; border-color: rgba(234, 179, 8, 0.4); }
        .sg-wait { background: rgba(100, 116, 139, 0.25); color: #cbd5e1; border-color: rgba(100, 116, 139, 0.4); }
        .sg-halt { background: rgba(249, 115, 22, 0.22); color: #fdba74; border-color: rgba(249, 115, 22, 0.45); }

        /* Layer 3 */
        .layer3 {
            margin-top: 16px;
            display: grid;
            grid-template-columns: 200px minmax(0, 1fr);
            gap: 12px;
            align-items: stretch;
        }
        @media (max-width: 900px) {
            .layer3 { grid-template-columns: 1fr; }
        }
        .nav-panel {
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            background: var(--bg-surface);
            padding: 10px;
        }
        .nav-panel .coin-head {
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 6px;
            word-break: break-all;
        }
        .nav-panel .nav-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 8px 10px;
            margin-bottom: 4px;
            border: 1px solid transparent;
            border-radius: 8px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.82rem;
            cursor: pointer;
        }
        .nav-panel .nav-btn:hover { background: var(--bg-elevated); color: var(--text-primary); }
        .nav-panel .nav-btn.active {
            border-color: var(--brand-accent);
            color: var(--brand-accent);
            background: rgba(56, 189, 248, 0.08);
        }

        .detail-panel {
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            background: var(--bg-surface);
            padding: 14px 16px;
            min-height: 320px;
        }
        .detail-panel section {
            display: none;
            animation: fade 0.2s ease;
        }
        .detail-panel section.visible { display: block; }
        @keyframes fade { from { opacity: 0.6; } to { opacity: 1; } }

        .mod-title {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--brand-accent);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin: 0 0 10px 0;
        }
        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 8px 16px;
            font-size: 0.82rem;
        }
        .detail-p {
            margin: 0 0 8px 0;
            font-size: 0.84rem;
            line-height: 1.55;
            color: var(--text-primary);
            white-space: pre-wrap;
            word-break: break-word;
        }
        .sec1-evidence-wrap {
            margin: 0 0 10px 0;
        }
        .sec1-evidence-label {
            display: block;
            font-size: 0.68rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            color: var(--text-secondary);
            margin-bottom: 4px;
            opacity: 0.92;
        }
        .sec1-evidence-teaser {
            font-size: 0.78rem;
            line-height: 1.45;
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            overflow: hidden;
            word-break: break-word;
        }
        .empty-hint { color: var(--text-secondary); font-size: 0.82rem; }
        .conclusion-hero {
            border: 1px solid var(--border-subtle);
            border-radius: 10px;
            padding: 11px 12px;
            margin-bottom: 10px;
            background: var(--bg-elevated);
        }
        .conclusion-main {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 8px;
        }
        .conclusion-metrics {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: flex-end;
            gap: 5px;
        }
        .conclusion-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 6px;
        }
        .conclusion-bias {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.01em;
        }
        .conclusion-bias.bull { color: var(--tag-bull); }
        .conclusion-bias.bear { color: var(--tag-bear); }
        .conclusion-bias.neu { color: var(--tag-neutral); }
        .conclusion-sub {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 6px 12px;
            border-top: 1px dashed var(--border-subtle);
            padding-top: 8px;
            margin-top: 2px;
        }
        .conclusion-sub .kv { margin-bottom: 0; font-size: 0.76rem; }
        .side-note {
            margin-top: 8px;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px dashed var(--border-subtle);
            color: var(--text-secondary);
            font-size: 0.78rem;
            background: transparent;
        }

        .runtime-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--border-subtle);
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 0.78rem;
            color: var(--text-secondary);
        }
        .runtime-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--status-ok);
        }
        .position-monitor-table-wrap {
            width: 100%;
            min-width: 0;
            overflow: hidden;
        }

        /* Position monitor native table final style */
        .position-monitor-table-native {
            width: 100%;
            table-layout: fixed;
            border-collapse: separate;
            border-spacing: 0 6px;
        }

        .position-monitor-table-native th,
        .position-monitor-table-native td {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            box-sizing: border-box;
        }

        .position-monitor-table-native th {
            height: 24px;
            padding: 0 8px;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 600;
            line-height: 18px;
            text-align: left;
        }

        .position-monitor-table-native td {
            height: 36px;
            padding: 0 8px;
            font-size: 12px;
            line-height: 18px;
            vertical-align: middle;
            border-top: 1px solid rgba(148, 163, 184, 0.22);
            border-bottom: 1px solid rgba(148, 163, 184, 0.22);
            background: #fff;
        }

        .position-monitor-table-native td:first-child {
            border-left: 1px solid rgba(148, 163, 184, 0.22);
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
            position: relative;
            padding-left: 12px;
        }

        .position-monitor-table-native td:first-child::before {
            content: "";
            position: absolute;
            left: 0;
            top: 7px;
            bottom: 7px;
            width: 3px;
            border-radius: 999px;
            background: #94a3b8;
        }

        .position-monitor-table-native tr.severity-danger td:first-child::before {
            background: #ff3b30;
        }

        .position-monitor-table-native tr.severity-warning td:first-child::before {
            background: #ff9500;
        }

        .position-monitor-table-native tr.severity-normal td:first-child::before {
            background: #34c759;
        }

        .position-monitor-table-native tr.severity-neutral td:first-child::before {
            background: #94a3b8;
        }

        .position-monitor-table-native td:last-child {
            border-right: 1px solid rgba(148, 163, 184, 0.22);
            border-top-right-radius: 10px;
            border-bottom-right-radius: 10px;
        }

        .position-monitor-table-native .pm-symbol {
            font-weight: 700;
        }

        .position-monitor-table-native th:nth-child(1),
        .position-monitor-table-native td:nth-child(1) {
            text-align: left;
        }

        .position-monitor-table-native th:nth-child(2),
        .position-monitor-table-native td:nth-child(2),
        .position-monitor-table-native th:nth-child(5),
        .position-monitor-table-native td:nth-child(5),
        .position-monitor-table-native th:nth-child(6),
        .position-monitor-table-native td:nth-child(6),
        .position-monitor-table-native th:nth-child(7),
        .position-monitor-table-native td:nth-child(7),
        .position-monitor-table-native th:nth-child(8),
        .position-monitor-table-native td:nth-child(8),
        .position-monitor-table-native th:nth-child(9),
        .position-monitor-table-native td:nth-child(9),
        .position-monitor-table-native th:nth-child(10),
        .position-monitor-table-native td:nth-child(10),
        .position-monitor-table-native th:nth-child(11),
        .position-monitor-table-native td:nth-child(11) {
            text-align: center;
        }

        .position-monitor-table-native th:nth-child(3),
        .position-monitor-table-native td:nth-child(3),
        .position-monitor-table-native th:nth-child(4),
        .position-monitor-table-native td:nth-child(4) {
            text-align: left;
        }

        .position-monitor-table-native th:nth-child(12),
        .position-monitor-table-native td:nth-child(12) {
            text-align: right;
        }

        .position-monitor-table-native .pm-boundary-cell {
            padding-left: 4px;
            padding-right: 4px;
        }

        .position-monitor-table-native .pm-boundary-tag {
            display: inline-block;
            max-width: 56px;
            padding: 2px 5px;
            border-radius: 6px;
            font-size: 0.72rem;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            vertical-align: middle;
            border: 1px solid rgba(148, 163, 184, 0.45);
            background: rgba(248, 250, 252, 0.75);
            color: var(--text-secondary);
            cursor: default;
        }

        .position-monitor-table-native .pm-boundary-tag.pm-boundary-missing {
            opacity: 0.85;
        }

        .position-monitor-table-native .pm-row-actions {
            text-align: right;
            white-space: nowrap;
        }

        .position-monitor-table-native .pm-row-actions .btn,
        .position-monitor-table-native .pm-row-actions button {
            width: 48px;
            height: 26px;
            padding: 3px 6px;
            font-size: 12px;
            line-height: 18px;
            white-space: nowrap;
            margin-left: 4px;
        }

        .position-monitor-table-native .position-monitor-empty-row td {
            text-align: left;
            color: var(--text-secondary);
            border: 1px dashed rgba(148, 163, 184, 0.28);
            border-radius: 10px;
            background: rgba(248, 250, 252, 0.68);
            padding: 10px 12px;
        }

    </style>
</head>
<body>
    <header class="top-bar">
        <div class="brand-block">
            <!-- 顶部主标题（必须为 TRINE LOGIC (V1)） -->

    <script src="/js/alert-explain.js"></script>
    <script>
/*
 * =============================================================================
 * TRINE LOGIC (V1) dashboard — 数据说明（供审核）
 * =============================================================================
 * 页面结构（固定三层，勿改为长列表堆叠）：
 *   第一层 .layer1：系统摘要 | 高优先级提醒 | 行情警告 | 今日遗漏但正确机会
 *   第二层 .layer2-head + #tilesRow：市场机会与风险总览；仅渲染最多 6 个币方块（见 buildDisplayList）
 *   第三层 .layer3：左侧 #navPanel 导航 + 右侧 #detailPanel 详情（点击第二层方块切换，不跳转）
 *
 * 中层 6 币约束：displayDecisions = 过滤后的 list.slice(0, 6)，不会出现第 7、8 个币。
 * 布局：.tiles-row 为 flex + nowrap + overflow-x:auto，单行横向排列；窄屏横向滚动。
 *
 * -----------------------------------------------------------------------------
 * A) 现有后端 /api/dashboard/refresh 已提供的真实字段 —— 直接用于展示映射（非伪装）
 * -----------------------------------------------------------------------------
 * systemStatus（LightSystemStatusVO）：status, monitoredCoins, lastDecisionTime, totalDecisionsToday，
 *   missedValidOpportunityCount（今日 biz_date 错失条数，tm_missed_opportunity），
 *   hotResetFired, hotResetSymbol, hotResetTriggerType, hotResetTriggerValue, hotResetTime（最近一次 Hot Reset，全库按时间聚合）
 * systemHealth（Map）：cpuUsage, memoryUsage, databaseStatus, schedulerStatus 等
 * alerts：alertLevel, alertMessage, createdAt
 * decisions[]（DecisionResultVO）：decisionId, analysisId, symbol, marketBiasHierarchy, tradeType,
 *   confidenceLevel, riskLevel, actionPriority, conclusionSummary, isWorthOpening, multiTfConvergence,
 *   aiRoleResults, isAdopted（系统采纳，≠ 真实持仓）, validPeriod, invalidCondition, evidenceSummary, executionPlanSummary, createTime,
 *   latestPrice, priceChangePct, priceUpdateTimeMs
 *   · 首页「是否值得开仓」仅映射 isWorthOpening；「开仓建议」仅映射 recommendedAction（后端未贯通 JSON 无时固定「建议待补充」，禁止与 isWorthOpening 混用）。
 *
 * 上述字段在界面上的中文标签对应关系见产品说明（如 marketBiasHierarchy → 方向），不在此重复字段名给用户。
 *
 * 当前价格 / 涨跌 / 「最新价格」优先使用 latestPrice / priceChangePct；当字段缺失时前端兜底展示「— / 暂无」。
 *
 * -----------------------------------------------------------------------------
 * B) 历史兼容逻辑（仅旧行兜底，避免误读为后端真值）
 * -----------------------------------------------------------------------------
 * aiConflictLevel / aiConflictScore / confusedScore / reviewReasons / explanationJson / assetStateSnapshot
 *   / readModelFallbackReason：优先展示后端真实字段；字段缺失时仅显示中性“待后端”文案，不再推导业务语义。
 * readModelTruthStatus：Layer2 tile 第四枚标签仅映射 FULL→读模型齐套、PARTIAL→读模型未齐套；未知时中性占位（不冒充复核/ recheck）。
 * hot_reset_* / hotReset*：dashboard 展示的是 tm_asset_state 全库“最近一次 Hot Reset 当前行语义”，
 *   不是单次 analysis 的独立事件流水；readHotReset() 同时兼容 snake_case 与 camelCase。
 *   无最近一次事件时 Hot Reset 显示未触发。
 * 今日可复盘机会（第四张卡片）：missedOpportunityCount() 优先读 systemStatus.missedValidOpportunityCount /
 *   missed_valid_opportunity_count；无或为非数字时显示 0。
 *
 * 第一层 reverse/pending/confused 统计：仅展示后端聚合字段；缺失时显示“—”并提示待后端补齐。
 * =============================================================================
 */
(function () {
    var REFRESH_MS = 30000;
    var refreshTimer = null;
    var allDecisions = [];
    var displayDecisions = [];
    var detailDecisionMap = {};
    var detailMarketEnvironmentMiniMap = {};
    var detailEvidenceTopItemsMap = {};
    var detailScoreTopItemsMap = {};
    var selectedSymbol = null;
    var searchQuery = "";
    var modeValue = "system";
    var CUSTOM_LS_KEY = "trine_dashboard_custom_symbols";
    var MODE_LS_KEY = "trine_dashboard_mode";
    var showNavSection = function () {};
    var positionProviderStatus = { text: "状态待确认", className: "neutral" };
    window.__providerStatusText = "状态待确认";
    window.__providerStatusClass = "neutral";
    window.__lastLayer1State = { systemStatus: null, systemHealth: null, alerts: [], decisions: [], openPositionCount: 0 };

    function loadCustomSymbols() {
        try {
            var raw = localStorage.getItem(CUSTOM_LS_KEY);
            if (!raw) return [];
            var a = JSON.parse(raw);
            if (!Array.isArray(a)) return [];
            return a.map(function (s) { return String(s || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, ""); }).filter(Boolean);
        } catch (e) {
            return [];
        }
    }

    function saveCustomSymbols(arr) {
        localStorage.setItem(CUSTOM_LS_KEY, JSON.stringify(arr || []));
    }

    /**
     * 真实持仓：仅以接口返回的持仓事实字段为准，不得用 isAdopted 推断「已开仓 / 持仓中」。
     * 当前 DecisionResultVO 无持仓字段，一般为 false；若将来 JSON 增加 hasOpenPosition、持仓数量、开仓价、开仓时刻等再判定。
     */
    function hasRealPositionDetail(d) {
        if (!d || typeof d !== "object") return false;
        if (d.hasOpenPosition === true || d.has_open_position === true) return true;
        var status = (d.positionStatus != null ? d.positionStatus : d.position_status);
        if (status && String(status).toUpperCase() === "OPEN") {
            var side = d.positionSide != null ? d.positionSide : d.position_side;
            var openPrice = d.avgOpenPrice != null ? d.avgOpenPrice : d.avg_open_price;
            return !!(side || openPrice != null);
        }
        return false;
    }

    function updateModeHint() {
        var el = document.getElementById("modeHint");
        if (!el) return;
        if (modeValue === "system") {
            el.textContent = "当前：系统推荐 · 决策时间倒序取前 6 条";
        } else {
            el.textContent = "当前：自定义监控 · 本机已保存 " + loadCustomSymbols().length + " 个标的（仅浏览器）";
        }
    }

    function escapeHtml(value) {
        return (value ?? "").toString()
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
    }

    function nowText() {
        return new Date().toLocaleString("zh-CN", { hour12: false });
    }

    function todayDateText() {
        var d = new Date();
        var pad = function (n) { return n < 10 ? "0" + n : "" + n; };
        return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
    }

    function formatDateTime(v) {
        if (v == null) return "—";
        if (typeof v === "number") {
            var d = new Date(v);
            if (isNaN(d.getTime())) return "—";
            return d.toLocaleString("zh-CN", { hour12: false });
        }
        if (typeof v === "string") {
            var s = v.replace("T", " ");
            if (s.length > 19) return s.slice(0, 19);
            return s;
        }
        if (Array.isArray(v) && v.length >= 6) {
            var pad = function (n) { return n < 10 ? "0" + n : "" + n; };
            return v[0] + "-" + pad(v[1]) + "-" + pad(v[2]) + " " + pad(v[3]) + ":" + pad(v[4]) + ":" + pad(v[5]);
        }
        return String(v);
    }

    function formatPrice(v) {
        if (v == null || v === "") return "—";
        var n = Number(v);
        if (!isFinite(n)) return "—";
        var abs = Math.abs(n);
        var digits = 2;
        if (abs >= 1000) digits = 2;
        else if (abs >= 1) digits = 4;
        else if (abs >= 0.01) digits = 6;
        else digits = 8;
        return n.toFixed(digits).replace(/\.?0+$/, "");
    }

    function formatChangePct(v) {
        if (v == null || v === "") return "暂无";
        var n = Number(v);
        if (!isFinite(n)) return "暂无";
        var sign = n > 0 ? "+" : "";
        return sign + n.toFixed(2) + "%";
    }

    function priceUpdateTime(d) {
        if (!d || typeof d !== "object") return "—";
        if (d.priceUpdateTimeMs != null) return formatDateTime(d.priceUpdateTimeMs);
        if (d.price_update_time_ms != null) return formatDateTime(d.price_update_time_ms);
        return "—";
    }

    function formatPriceLine(d) {
        var p = formatPrice(d.latestPrice != null ? d.latestPrice : d.latest_price);
        var c = formatChangePct(d.priceChangePct != null ? d.priceChangePct : d.price_change_pct);
        return "当前价格：" + p + " · 涨跌：" + c;
    }

    function biasText(bias) {
        var v = (bias || "").toUpperCase();
        if (v === "BULLISH") return "偏多";
        if (v === "BEARISH") return "偏空";
        return "中性";
    }

    function biasClass(bias) {
        var v = (bias || "").toUpperCase();
        if (v === "BULLISH") return "bull";
        if (v === "BEARISH") return "bear";
        return "neu";
    }

    function positionSideText(side) {
        var v = (side || "").toString().toUpperCase();
        if (v === "LONG") return "多单";
        if (v === "SHORT") return "空单";
        return "—";
    }

    function decisionSideByBias(d) {
        var v = (d && d.marketBiasHierarchy ? d.marketBiasHierarchy : "").toString().toUpperCase();
        if (v === "BULLISH") return "LONG";
        if (v === "BEARISH") return "SHORT";
        return "NEUTRAL";
    }

    function directionConsistencyText(d) {
        var positionSide = (d.positionSide != null ? d.positionSide : d.position_side || "").toString().toUpperCase();
        var decisionSide = decisionSideByBias(d);
        if (!positionSide) return "需观察";
        if (decisionSide === "NEUTRAL") return "需观察";
        return positionSide === decisionSide ? "一致" : "反向";
    }

    function positionHealthTag(d) {
        var consistency = directionConsistencyText(d);
        var risk = riskLevelText(d.riskLevel);
        var conflictLv = resolveAiConflict(d).level;
        if (consistency === "反向") return "逻辑反转";
        if (risk === "高" || conflictLv >= 4) return "持仓预警";
        if (conflictLv >= 3 || consistency === "需观察") return "持仓观察";
        return "持仓健康";
    }

    function formatPct(v) {
        if (v == null || v === "") return "—";
        var n = Number(v);
        if (!isFinite(n)) return "—";
        return (n > 0 ? "+" : "") + n.toFixed(2) + "%";
    }

    function riskLevelText(level) {
        var v = (level || "").toString().toUpperCase();
        if (!v) return "—";
        if (v.indexOf("LOW") >= 0 || v.indexOf("低") >= 0) return "低";
        if (v.indexOf("MEDIUM") >= 0 || v.indexOf("MID") >= 0 || v.indexOf("中") >= 0) return "中";
        if (v.indexOf("HIGH") >= 0 || v.indexOf("CRITICAL") >= 0 || v.indexOf("高") >= 0) return "高";
        return (level || "").toString();
    }

    function convergenceText(v) {
        var t = (v || "").toString().toUpperCase();
        if (!t) return "—";
        if (t === "STRONG") return "强";
        if (t === "WEAK") return "弱";
        if (t.indexOf("强") >= 0) return "强";
        if (t.indexOf("弱") >= 0) return "弱";
        return String(v);
    }

    function normalizeReadableText(text) {
        var s = (text || "").toString();
        if (!s.trim()) return "—";
        return s
            .replace(/一致\s*Lv\.?\s*1/gi, "信号一致")
            .replace(/轻微分歧\s*Lv\.?\s*2/gi, "轻度分歧")
            .replace(/显著分歧\s*Lv\.?\s*3/gi, "明显分歧")
            .replace(/冲突暂停\s*Lv\.?\s*4/gi, "信号冲突，暂停执行")
            .replace(/\bLv\.?\s*1\b/gi, "信号一致")
            .replace(/\bLv\.?\s*2\b/gi, "轻度分歧")
            .replace(/\bLv\.?\s*3\b/gi, "明显分歧")
            .replace(/\bLv\.?\s*4\b/gi, "信号冲突，暂停执行")
            .replace(/\bBULLISH\b/gi, "偏多")
            .replace(/\bBEARISH\b/gi, "偏空")
            .replace(/\bNEUTRAL\b/gi, "中性")
            .replace(/\bSTRONG\b/gi, "强")
            .replace(/\bWEAK\b/gi, "弱")
            .replace(/\bHIGH\b/gi, "高")
            .replace(/\bMEDIUM\b/gi, "中")
            .replace(/\bLOW\b/gi, "低")
            .replace(/\bCONFUSED\b/gi, "冲突中");
    }

    function parseJsonObjectSafe(raw) {
        if (!raw || typeof raw !== "string") return null;
        try {
            var parsed = JSON.parse(raw);
            if (parsed && typeof parsed === "object" && !Array.isArray(parsed)) return parsed;
        } catch (e) {}
        return null;
    }

    function pickFirstText(obj, keys) {
        if (!obj || typeof obj !== "object") return "";
        for (var i = 0; i < keys.length; i++) {
            var value = obj[keys[i]];
            if (value == null) continue;
            if (typeof value === "string" && value.trim()) return value.trim();
            if (typeof value === "number" || typeof value === "boolean") return String(value);
        }
        return "";
    }

    function parseReviewReasons(raw) {
        if (!raw) return [];
        if (Array.isArray(raw)) return raw.map(function (v) { return String(v || "").trim(); }).filter(Boolean);
        if (typeof raw !== "string") return [];
        var s = raw.trim();
        if (!s) return [];
        try {
            var parsed = JSON.parse(s);
            if (Array.isArray(parsed)) return parsed.map(function (v) { return String(v || "").trim(); }).filter(Boolean);
            if (parsed && Array.isArray(parsed.reasons)) return parsed.reasons.map(function (v) { return String(v || "").trim(); }).filter(Boolean);
        } catch (e) {}
        if (s.indexOf("\n") >= 0) return s.split(/\r?\n/).map(function (line) { return line.replace(/^\s*[-*]\s*/, "").trim(); }).filter(Boolean);
        return s.split(/[,;；]/).map(function (part) { return part.trim(); }).filter(Boolean);
    }

    function alertLevelText(level) {
        var l = (level || "").toString().toUpperCase();
        if (!l) return "—";
        if (l === "CRITICAL" || l === "BLACKSWAN") return "极高";
        if (l === "HIGH") return "高";
        if (l === "MEDIUM") return "中";
        if (l === "LOW") return "低";
        return normalizeReadableText(level);
    }

    function confidenceText(level) {
        var v = (level || "").toUpperCase();
        if (v.includes("HIGH") || v.includes("高")) return "高";
        if (v.includes("LOW") || v.includes("低")) return "低";
        if (v) return "中";
        return "—";
    }
    function confidenceBadge(level) {
        var t = confidenceText(level);
        if (t === "高") return "高置信";
        if (t === "中") return "中置信";
        if (t === "低") return "低置信";
        return "置信度—";
    }

    function isHighRisk(d) {
        var r = (d.riskLevel || "").toUpperCase();
        return r.includes("HIGH") || r.includes("高") || r.includes("CRITICAL");
    }

    function mapConflictLabel(levelRaw) {
        var v = (levelRaw == null ? "" : String(levelRaw)).trim();
        if (!v) return "";
        var u = v.toUpperCase();
        if (u === "L1" || u === "LV1" || u.indexOf("LEVEL_1") >= 0 || u.indexOf("LOW") >= 0 || u === "1") return "信号一致";
        if (u === "L2" || u === "LV2" || u.indexOf("LEVEL_2") >= 0 || u.indexOf("MILD") >= 0 || u === "2") return "轻度分歧";
        if (u === "L3" || u === "LV3" || u.indexOf("LEVEL_3") >= 0 || u.indexOf("HIGH") >= 0 || u === "3") return "明显分歧";
        if (u === "L4" || u === "LV4" || u.indexOf("LEVEL_4") >= 0 || u.indexOf("BLOCK") >= 0 || u === "4") return "信号冲突，暂停执行";
        return normalizeReadableText(v);
    }

    function mapConflictLevelNumber(levelRaw, score) {
        var u = (levelRaw == null ? "" : String(levelRaw)).trim().toUpperCase();
        if (u === "L1" || u === "LV1" || u.indexOf("LEVEL_1") >= 0 || u === "1") return 1;
        if (u === "L2" || u === "LV2" || u.indexOf("LEVEL_2") >= 0 || u === "2") return 2;
        if (u === "L3" || u === "LV3" || u.indexOf("LEVEL_3") >= 0 || u === "3") return 3;
        if (u === "L4" || u === "LV4" || u.indexOf("LEVEL_4") >= 0 || u === "4") return 4;
        if (score != null && isFinite(Number(score))) {
            var n = Number(score);
            if (n >= 80) return 4;
            if (n >= 60) return 3;
            if (n >= 35) return 2;
        }
        return 1;
    }

    function formatWithSource(text, source) {
        if (!text) return "—";
        if (source === "heuristic" || source === "fallback") return text + "（fallback）";
        return text;
    }

    function resolveAiConflict(d) {
        var levelRaw = d && (d.aiConflictLevel != null ? d.aiConflictLevel : d.ai_conflict_level);
        var scoreRaw = d && (d.aiConflictScore != null ? d.aiConflictScore : d.ai_conflict_score);
        if (levelRaw != null || scoreRaw != null) {
            var label = mapConflictLabel(levelRaw);
            var level = mapConflictLevelNumber(levelRaw, scoreRaw);
            var shortText = label || ("Lv." + level);
            return { level: level, short: shortText, label: shortText, score: scoreRaw, source: "backend" };
        }
        return { level: null, short: "字段缺失", label: "字段缺失", score: null, source: "fallback" };
    }

    /** readModelTruthStatus：tile 标签用读模型齐套语义，不依赖 recheckStatus。 */
    function resolveReadModelTruthTilePresentation(d) {
        var raw = d && (d.readModelTruthStatus != null ? d.readModelTruthStatus : d.read_model_truth_status);
        var u = raw != null ? String(raw).trim().toUpperCase() : "";
        if (u === "FULL") return { text: "读模型齐套", cls: "sg-care", source: "backend" };
        if (u === "PARTIAL") return { text: "读模型未齐套", cls: "sg-care", source: "backend" };
        return { text: "读模型状态待定", cls: "sg-care", source: "neutral" };
    }

    function pickIsWorthOpening(d) {
        if (!d) return undefined;
        var v = d.isWorthOpening !== undefined ? d.isWorthOpening : d.is_worth_opening;
        if (v === true || v === false) return v;
        return undefined;
    }

    /** 是否值得开仓：仅 isWorthOpening / is_worth_opening（与开仓建议语义分离）。 */
    function resolveWorthOpeningPresentation(d) {
        var worth = pickIsWorthOpening(d);
        if (worth === true) return { text: "值得开仓", cls: "sg-open", source: "backend" };
        if (worth === false) return { text: "暂不值得开仓", cls: "sg-wait", source: "backend" };
        return { text: "开仓判断待定", cls: "sg-care", source: "neutral" };
    }

    /** 开仓建议：仅 recommendedAction / recommended_action；后端未贯通时占位，禁止用 isWorthOpening 代替。 */
    function resolveRecommendedActionPresentation(d) {
        var raw = d && (d.recommendedAction != null ? d.recommendedAction : d.recommended_action);
        if (raw != null && String(raw).trim()) {
            return { text: normalizeReadableText(String(raw).trim()), cls: "sg-care", source: "backend" };
        }
        return { text: "建议待补充", cls: "sg-care", source: "neutral" };
    }

    function isConfusedState(d) {
        return resolveConfusedState(d).isConfused;
    }

    function resolveConfusedState(d) {
        var scoreRaw = d && (d.confusedScore != null ? d.confusedScore : d.confused_score);
        var stateRaw = d && (d.isConfused != null ? d.isConfused : d.is_confused);
        if (scoreRaw != null && isFinite(Number(scoreRaw))) {
            var s = Number(scoreRaw);
            return { isConfused: s > 0, score: s, source: "backend" };
        }
        if (stateRaw != null) {
            var state = stateRaw === true || String(stateRaw).toUpperCase() === "TRUE";
            return { isConfused: state, score: state ? 1 : 0, source: "backend" };
        }
        // 缺少后端字段时，不再由前端 heuristic 主导 confused 语义。
        return { isConfused: false, score: null, source: "fallback" };
    }

    function resolveConfusedScore(d) {
        return resolveConfusedState(d).score;
    }

    function resolveIsConfused(d) {
        return resolveConfusedState(d).isConfused;
    }

    function confusedCount(decisions) {
        var n = 0;
        (decisions || []).forEach(function (d) {
            var state = resolveConfusedState(d);
            if (state.source === "backend" && state.isConfused) n++;
        });
        return n;
    }

    /** 冲突来源摘要仅作阅读文案，不作为状态判定真值。 */
    function confusedSourceSummary(d) {
        var weak = (d.multiTfConvergence || "").toUpperCase() === "WEAK";
        var parts = [];
        if (weak) parts.push("多周期一致性偏弱");
        if ((d.evidenceSummary || "").indexOf("执行") >= 0 || weak) parts.push("执行不稳定");
        if (!parts.length) parts.push("信号与风险权重冲突");
        return parts.slice(0, 2).join(" + ");
    }

    /** 【固定短文案】恢复条件说明，非后端字段。 */
    function confusedRecoverySummary() {
        return "等待多周期一致性恢复并通过二次确认";
    }

    /**
     * 【hot_reset_*】systemStatus 提供 hotResetTriggerType、hotResetTime 等（readHotReset 兼容 snake_case）。
     */
    function readHotReset(sys) {
        sys = sys || {};
        var trig = sys.hot_reset_trigger_type != null ? String(sys.hot_reset_trigger_type) : (sys.hotResetTriggerType != null ? String(sys.hotResetTriggerType) : "");
        var time = sys.hot_reset_time != null ? sys.hot_reset_time : sys.hotResetTime;
        var fired = sys.hot_reset_fired === true || sys.hotResetFired === true || (trig && String(trig).length > 0);
        return { fired: fired, trigger: trig, time: time };
    }

    function pickSystemStatusNumber(keys) {
        var sys = window.__lastSystemStatus || {};
        for (var i = 0; i < keys.length; i++) {
            var key = keys[i];
            if (typeof sys[key] === "number" && isFinite(sys[key])) return sys[key];
        }
        return null;
    }

    /** Step 3: 聚合字段仅以后端为准；缺失时返回不可判定。 */
    function countReverseSignals(decisions) {
        var backend = pickSystemStatusNumber(["reverseSignalCount", "reverse_signal_count"]);
        if (backend != null) return { value: backend, source: "backend" };
        return { value: null, source: "fallback" };
    }

    /** Step 3: 聚合字段仅以后端为准；缺失时返回不可判定。 */
    function countPending(decisions) {
        var backend = pickSystemStatusNumber(["pendingCount", "pending_count"]);
        if (backend != null) return { value: backend, source: "backend" };
        return { value: null, source: "fallback" };
    }

    /** Step 3: 聚合字段仅以后端为准；缺失时返回不可判定。 */
    function countConfused(decisions) {
        var backend = pickSystemStatusNumber(["confusedCount", "confused_count"]);
        if (backend != null) return { value: backend, source: "backend" };
        return { value: null, source: "fallback" };
    }

    function formatNumberWithSource(value, source) {
        if (value == null) return "—";
        return (source === "fallback") ? (String(value) + "（fallback）") : String(value);
    }

    /**
     * 【真实映射优先】若 systemStatus 将来提供 missedValidOpportunityCount / missed_valid_opportunity_count 则直接用；
     * 【否则】返回 0，不伪造遗漏笔数。
     */
    function missedOpportunityCount(decisions) {
        var sys = window.__lastSystemStatus || {};
        if (typeof sys.missedValidOpportunityCount === "number") return sys.missedValidOpportunityCount;
        if (typeof sys.missed_valid_opportunity_count === "number") return sys.missed_valid_opportunity_count;
        return 0;
    }

    function apiStatusLine(health) {
        health = health || {};
        var db = health.databaseStatus || "—";
        var ok = (db + "").toUpperCase().indexOf("UP") >= 0 || (db + "").indexOf("正常") >= 0;
        return ok ? "可连接" : String(db);
    }

    function mapSchedulerStatusDisplay(health) {
        health = health || {};
        var s = health.schedulerStatus;
        if (s == null || String(s).trim() === "") return "—";
        var u = String(s).toUpperCase();
        if (u === "RUNNING") return "运行中";
        if (u === "STALE") return "陈旧";
        if (u === "NO_RECENT_ACTIVITY") return "无近期活动";
        return String(s);
    }

    function resolvePositionProviderStatus(payload) {
        var d = payload || {};
        var configured = (d.configuredProviderType || "").toString().toUpperCase();
        var active = (d.activeProviderType || "").toString().toUpperCase();
        var fallback = d.fallbackOccurred === true;
        var reason = (d.fallbackReason || "").toString().trim();

        if (configured === "SIMULATED" && active === "SIMULATED") {
            return { text: "模拟", className: "neutral" };
        }
        if (configured === "BINANCE" && active === "BINANCE" && !fallback) {
            return { text: "Binance（已生效）", className: "ok" };
        }
        if (configured === "BINANCE" && active === "SIMULATED" && fallback) {
            var suffix = reason ? "（当前降级为模拟）" : "（当前降级为模拟）";
            return { text: "Binance" + suffix, className: "warn" };
        }
        return { text: "状态待确认", className: "neutral" };
    }

    function updateProviderStatusDisplay() {
        var el = document.getElementById("providerStatusValue");
        if (!el) return;
        var cls = positionProviderStatus.className || "neutral";
        var text = positionProviderStatus.text || "状态待确认";
        el.className = "v provider-state " + cls;
        el.textContent = text;
    }

    function fetchPositionProviderStatus() {
        return fetch("/api/system/position-sync-status")
            .then(function (r) { return r.ok ? r.json() : Promise.reject(r); })
            .then(function (resp) {
                var payload = resp && typeof resp === "object" && resp.data ? resp.data : resp;
                positionProviderStatus = resolvePositionProviderStatus(payload);
                window.__providerStatusText = positionProviderStatus.text || "状态待确认";
                window.__providerStatusClass = positionProviderStatus.className || "neutral";
                updateProviderStatusDisplay();
            })
            .catch(function () {
                positionProviderStatus = { text: "状态待确认", className: "neutral" };
                window.__providerStatusText = "状态待确认";
                window.__providerStatusClass = "neutral";
                updateProviderStatusDisplay();
            });
    }

    function setRuntimeStatus(statusText) {
        var dot = document.getElementById("runtimeDot");
        var text = document.getElementById("runtimeText");
        var status = (statusText || "OK").toUpperCase();
        if (status.indexOf("ERROR") >= 0 || status.indexOf("DOWN") >= 0) {
            dot.style.background = "var(--status-error)";
            text.textContent = "运行异常";
            return;
        }
        if (status.indexOf("WARN") >= 0) {
            dot.style.background = "var(--status-warn)";
            text.textContent = "运行关注";
            return;
        }
        dot.style.background = "var(--status-ok)";
        text.textContent = "系统运行中";
    }

    /** 中层最多 6 条：list.slice(0, 6)，禁止渲染第 7、8 个币。 */
    function buildDisplayList() {
        var list = allDecisions.slice();
        if (modeValue === "custom") {
            var want = loadCustomSymbols();
            if (!want.length) {
                list = [];
            } else {
                var set = {};
                want.forEach(function (s) { set[s] = true; });
                list = list.filter(function (d) {
                    var key = (d.symbol || "").toUpperCase();
                    return set[key];
                });
            }
        }
        var q = (searchQuery || "").trim().toUpperCase();
        if (q) {
            list = list.filter(function (d) {
                return (d.symbol || "").toUpperCase().indexOf(q) >= 0;
            });
        }
        displayDecisions = list.slice(0, 6);
        detailDecisionMap = {};
        if (!displayDecisions.length) selectedSymbol = null;
        else if (!selectedSymbol || !displayDecisions.some(function (d) { return d.symbol === selectedSymbol; })) {
            selectedSymbol = displayDecisions[0].symbol;
        }
    }

    function renderLayer1(systemStatus, health, alerts, decisions, openPositionCount) {
        window.__lastSystemStatus = systemStatus || {};
        window.__lastLayer1State = {
            systemStatus: systemStatus || {},
            systemHealth: health || {},
            alerts: alerts || [],
            decisions: decisions || [],
            openPositionCount: Number(openPositionCount || 0)
        };
        var sys = systemStatus || {};
        var hot = readHotReset(sys);
        var ccMetric = countConfused(decisions);
        var ccDisplay = formatNumberWithSource(ccMetric.value, ccMetric.source);
        var confusedAggregateEmphasis = ccMetric.source === "backend"
            && typeof ccMetric.value === "number"
            && isFinite(ccMetric.value)
            && ccMetric.value > 0;
        var highRiskN = (decisions || []).filter(isHighRisk).length;
        var adoptedN = (decisions || []).filter(function (d) { return d.isAdopted === true; }).length;
        var mon = sys.monitoredCoins != null ? sys.monitoredCoins : "—";
        var lastU = formatDateTime(sys.lastDecisionTime);
        var providerText = positionProviderStatus.text || "状态待确认";
        var providerClassName = positionProviderStatus.className || "neutral";

        var hotHtml = "";
        if (hot.fired) {
            hotHtml = '<div class="hot-block active">' +
                '<div class="hot-title">Hot Reset：已触发</div>' +
                '<div class="kv"><span class="k">原因</span><span class="v">' + escapeHtml(hot.trigger || "—") + '</span></div>' +
                '<div class="kv"><span class="k">时间</span><span class="v">' + formatDateTime(hot.time) + '</span></div></div>';
        } else {
            hotHtml = '<div class="hot-block"><div class="hot-title" style="color:var(--text-secondary);font-weight:500;">Hot Reset：未触发</div></div>';
        }

        document.getElementById("layer1-system").innerHTML =
            '<div class="kv"><span class="k">系统运行状态</span><span class="v">' + escapeHtml((sys.status || "OK") === "OK" ? "正常" : (sys.status || "—")) + '</span></div>' +
            '<div class="kv"><span class="k">最后更新时间</span><span class="v">' + escapeHtml(lastU) + '</span></div>' +
            '<div class="kv"><span class="k">当前监控币种数</span><span class="v">' + escapeHtml(mon) + '</span></div>' +
            '<div class="kv"><span class="k">已采纳数（本批摘要）</span><span class="v">' + adoptedN + '</span></div>' +
            '<div class="kv"><span class="k">真实持仓记录</span><span class="v">' + Number(openPositionCount || 0) + '</span></div>' +
            '<div class="kv"><span class="k">持仓来源</span><span id="providerStatusValue" class="v provider-state ' + escapeHtml(providerClassName) + '">' + escapeHtml(providerText) + '</span></div>' +
            '<div class="kv"><span class="k">高风险数（本批摘要）</span><span class="v">' + highRiskN + '</span></div>' +
            '<div class="kv"><span class="k">当前冲突状态数</span><span class="v">' + escapeHtml(ccDisplay) + '</span></div>' +
            '<div class="kv"><span class="k">数据库连接</span><span class="v">' + escapeHtml(apiStatusLine(health)) + '</span></div>' +
            '<div class="kv"><span class="k">持仓同步状态</span><span class="v">' + escapeHtml(mapSchedulerStatusDisplay(health)) + '</span></div>' +
            '<div class="kv"><span class="k">Hot Reset 状态</span><span class="v">' + (hot.fired ? '<span style="color:var(--hot-reset);font-weight:600;">已触发</span>' : '未触发') + '</span></div>' +
            hotHtml;

        /* 高优先级提醒：黑天鹅 > Hot > Confused > 持仓反转 */
        var lines = [];
        var alertList = (alerts || []).slice();
        alertList.sort(function (a, b) {
            function rank(x) {
                var L = (x.alertLevel || "").toUpperCase();
                if (L === "CRITICAL" || L === "BLACKSWAN") return 0;
                if (L === "HIGH") return 1;
                if (L === "MEDIUM") return 2;
                return 3;
            }
            return rank(a) - rank(b);
        });
        var a0 = alertList[0];
        if (a0 && ((a0.alertLevel || "").toUpperCase() === "CRITICAL" || (a0.alertMessage || "").indexOf("黑天鹅") >= 0)) {
            lines.push({ cls: "critical", html: '<strong>极端风险</strong> · ' + escapeHtml(a0.alertMessage || "") });
        }
        if (hot.fired) {
            lines.push({ cls: "hot", html: '<strong>Hot Reset</strong> · 已触发 · ' + escapeHtml(hot.trigger || "原因待同步") });
        }
        if (confusedAggregateEmphasis) {
            var ccNum = ccMetric.value;
            var sample = (decisions || []).find(isConfusedState);
            var info = sample ? confusedExplain(sample) : { source: "多周期与执行冲突", action: "暂缓方向性执行，等待二次确认", recovery: confusedRecoverySummary() };
            lines.push({
                cls: "confused",
                html: '<strong>当前处于冲突状态</strong> · ' + ccNum + ' 个 · 原因：' + escapeHtml(info.source) +
                    '<br><span style="color:var(--text-secondary);font-size:0.72rem;">建议：' + escapeHtml(info.action) + "；恢复条件：" + escapeHtml(info.recovery) + "</span>"
            });
        }
        for (var i = 0; i < alertList.length && lines.length < 3; i++) {
            var a = alertList[i];
            var msg = a.alertMessage || "";
            if (msg.indexOf("反转") >= 0 || msg.indexOf("趋势反转") >= 0) {
                lines.push({ cls: "", html: '<strong>持仓逻辑反转风险</strong> · ' + escapeHtml(msg) });
            }
        }
        if (lines.length < 2) {
            for (var j = 0; j < alertList.length && lines.length < 3; j++) {
                var aj = alertList[j];
                var explain = (window.AlertExplain && window.AlertExplain.explainAlert)
                    ? window.AlertExplain.explainAlert(aj)
                    : null;
                var typeLabel = explain ? explain.alertTypeLabel : (aj.alertType || "—");
                var why = explain ? explain.why : (aj.alertMessage || "—");
                var statusLabel = (aj.status == null || String(aj.status).trim() === "") ? "UNKNOWN" : String(aj.status);
                lines.push({
                    cls: "",
                    html: escapeHtml("[" + statusLabel + "] " + alertLevelText(aj.alertLevel) + " · " + typeLabel + " · " + why)
                });
            }
        }
        if (!lines.length) {
            lines.push({ cls: "", html: '<span class="empty-hint">暂无高优先级事项</span>' });
        }
        document.getElementById("layer1-priority").innerHTML = lines.slice(0, 3).map(function (L) {
            return '<div class="alert-line ' + L.cls + '">' + L.html + "</div>";
        }).join("");

        var revMetric = countReverseSignals(decisions);
        var pendMetric = countPending(decisions);
        var rev = revMetric.value;
        var pend = pendMetric.value;
        var keyRem = [];
        if (confusedAggregateEmphasis) {
            var s0 = (decisions || []).find(isConfusedState);
            if (s0) keyRem.push("冲突中：" + confusedSourceSummary(s0));
        }
        if (highRiskN > 0) keyRem.push("本批摘要内高风险标的 " + highRiskN + " 个");
        if (typeof pend === "number" && pend > 0) keyRem.push("待确认 " + pend + " 个");
        document.getElementById("layer1-market").innerHTML =
            '<div class="kv"><span class="k">反转数量</span><span class="v">' + escapeHtml(formatNumberWithSource(rev, revMetric.source)) + '</span></div>' +
            '<div class="kv"><span class="k">高风险数（本批摘要）</span><span class="v">' + highRiskN + '</span></div>' +
            '<div class="kv"><span class="k">待确认数量</span><span class="v">' + escapeHtml(formatNumberWithSource(pend, pendMetric.source)) + '</span></div>' +
            ((rev == null || pend == null || ccMetric.value == null)
                ? '<div class="side-note" style="margin-top:8px;">部分统计字段待后端聚合字段（reverse/pending/confused）补齐后展示。</div>'
                : '') +
            '<div style="margin-top:8px;font-size:0.76rem;color:var(--text-secondary);">重点提醒</div>' +
            (keyRem.length ? keyRem.slice(0, 3).map(function (t) {
                return '<div class="alert-line">' + escapeHtml(t) + "</div>";
            }).join("") : '<div class="empty-hint">暂无</div>');

        var missed = missedOpportunityCount(decisions);
        var missedLink = "/api/missed-opportunity/query?bizDate=" + encodeURIComponent(todayDateText()) + "&limit=50";
        document.getElementById("layer1-missed").innerHTML =
            '<div class="kv"><span class="k">今日可复盘机会</span><span class="v">' + missed + '</span></div>' +
            '<p class="detail-p" style="margin-top:8px;color:var(--text-secondary);font-size:0.78rem;">系统已记录，可用于复盘检查。</p>' +
            '<p style="margin:8px 0 0;"><a class="btn" href="' + missedLink + '" target="_blank" rel="noopener">查看详情</a></p>';
    }

    function renderTiles() {
        var box = document.getElementById("tilesRow");
        if (!displayDecisions.length) {
            var emptyMsg = "暂无决策数据（等待首轮分析）";
            if (modeValue === "custom") {
                emptyMsg = loadCustomSymbols().length
                    ? "自定义列表中的标的暂无决策记录，或已被搜索过滤。"
                    : "自定义监控列表为空：请切换到本模式后在搜索框输入如 BTCUSDT 并点「添加」加入本机列表（仅存浏览器）。";
            }
            box.innerHTML = '<div class="card tile-full" style="text-align:center;padding:24px;"><span class="empty-hint">' + escapeHtml(emptyMsg) + "</span></div>";
            renderDetail(null);
            return;
        }
        box.innerHTML = displayDecisions.map(function (d, idx) {
            var sel = d.symbol === selectedSymbol ? " selected" : "";
            var bias = biasText(d.marketBiasHierarchy);
            var bcls = biasClass(d.marketBiasHierarchy);
            var ac = resolveAiConflict(d);
            var rmTile = resolveReadModelTruthTilePresentation(d);
            var worth = resolveWorthOpeningPresentation(d);
            var ra = resolveRecommendedActionPresentation(d);
            var pos = hasRealPositionDetail(d);
            var sideHint = positionSideText(d.positionSide != null ? d.positionSide : d.position_side);
            var conclusionRaw = d.conclusionSummary != null ? d.conclusionSummary : d.conclusion_summary;
            var conclusionTrim = conclusionRaw != null ? String(conclusionRaw).trim() : "";
            var conclusionHtml = conclusionTrim
                ? '<div class="tile-conclusion-line" title="' + escapeHtml(normalizeReadableText(conclusionTrim)) + '">' +
                    escapeHtml(normalizeReadableText(conclusionTrim)) + "</div>"
                : "";
            return '<div class="coin-tile bias-' + bcls + sel + '" data-symbol="' + escapeHtml(d.symbol || "") + '" data-idx="' + idx + '">' +
                '<button type="button" class="tile-del" data-symbol="' + escapeHtml(d.symbol || "") + '" title="自定义模式下可从本机列表移除">×</button>' +
                '<div class="sym"><span>' + escapeHtml(d.symbol || "—") + '</span>' +
                (pos ? '<span class="mini-tag" style="color:var(--brand-accent);border-color:rgba(56,189,248,0.4);">持仓中' + (sideHint !== "—" ? " · " + sideHint : "") + '</span>' : "") + "</div>" +
                conclusionHtml +
                '<div class="tile-primary">' +
                '<div class="tile-mainline"><span class="tile-bias ' + bcls + '">' + bias + '</span><span class="conf-badge">' + confidenceBadge(d.confidenceLevel) + "</span></div>" +
                '<div class="tile-tags-compact"><span class="mini-tag ' + worth.cls + '">' + escapeHtml(formatWithSource(worth.text, worth.source)) + '</span>' +
                '<span class="mini-tag ' + ra.cls + '">' + escapeHtml(formatWithSource(ra.text, ra.source)) + '</span>' +
                '<span class="mini-tag conflict">' + escapeHtml(formatWithSource(ac.short, ac.source)) + "</span>" +
                '<span class="mini-tag ' + rmTile.cls + '">' + escapeHtml(formatWithSource(rmTile.text, rmTile.source)) + "</span></div></div>" +
                '<div class="price">' + escapeHtml(formatPriceLine(d)) + '</div></div>';
        }).join("");

        Array.prototype.forEach.call(box.querySelectorAll(".coin-tile"), function (el) {
            el.addEventListener("click", function (e) {
                if (e.target.classList.contains("tile-del")) return;
                selectedSymbol = el.getAttribute("data-symbol");
                renderTiles();
                requestDetailForSelectedSymbol();
            });
        });
        Array.prototype.forEach.call(box.querySelectorAll(".tile-del"), function (btn) {
            btn.addEventListener("click", function (e) {
                e.stopPropagation();
                var sym = (btn.getAttribute("data-symbol") || "").toUpperCase();
                if (modeValue === "custom" && sym) {
                    var cur = loadCustomSymbols().filter(function (s) { return s !== sym; });
                    saveCustomSymbols(cur);
                    updateModeHint();
                    buildDisplayList();
                    renderTiles();
                    return;
                }
                alert("系统推荐模式下不维护本机列表；切换到「自定义监控」后可移除本机标的。");
            });
        });

        var cur = detailDecisionMap[selectedSymbol] || displayDecisions.find(function (x) { return x.symbol === selectedSymbol; });
        var marketEnvironmentMini = selectedSymbol ? detailMarketEnvironmentMiniMap[selectedSymbol] : null;
        var topItems = selectedSymbol ? detailEvidenceTopItemsMap[selectedSymbol] : [];
        var scoreItems = selectedSymbol ? detailScoreTopItemsMap[selectedSymbol] : [];
        renderDetail(cur || displayDecisions[0], marketEnvironmentMini, topItems, scoreItems);
    }

    function humanEvidenceSummary(d) {
        var e = d.evidenceSummary || "";
        if (!e.trim()) return "暂无可用摘要。";
        var n = normalizeReadableText(e);
        return n.length > 280 ? n.slice(0, 280) + "…" : n;
    }

    function confusedExplain(d) {
        var source = confusedSourceSummary(d);
        var action = "暂缓方向性执行，等待二次确认";
        if (d.isWorthOpening === false) {
            action = "暂缓开仓，等待信号重新收敛";
        }
        var recovery = d.confusedRecoveryHint || d.confused_recovery_hint || confusedRecoverySummary();
        return {
            source: source,
            action: action,
            recovery: recovery
        };
    }

    function executionBlock(d) {
        var c = resolveAiConflict(d);
        var confusedState = resolveConfusedState(d);
        var confused = confusedState.isConfused;
        var worth = pickIsWorthOpening(d);
        var rmRaw = d.readModelTruthStatus != null ? d.readModelTruthStatus : d.read_model_truth_status;
        var rmU = rmRaw != null ? String(rmRaw).trim().toUpperCase() : "";
        var readModelFull = rmU === "FULL";
        var frRaw = d.readModelFallbackReason != null ? d.readModelFallbackReason : d.read_model_fallback_reason;
        var frNonEmpty = frRaw != null && String(frRaw).trim().length > 0;
        var vpRaw = d.validPeriod != null ? d.validPeriod : d.valid_period;
        var invRaw = d.invalidCondition != null ? d.invalidCondition : d.invalid_condition;
        var vpOk = vpRaw != null && String(vpRaw).trim().length > 0;
        var invOk = invRaw != null && String(invRaw).trim().length > 0;
        var canShow = worth === true && c.level != null && c.level <= 2 && !confused && readModelFull && vpOk && invOk;

        if (!canShow) {
            var reason = "条件不足";
            if (confused) reason = "冲突中，暂缓执行";
            else if (worth === false) reason = "当前不值得开仓";
            else if (c.level != null && c.level >= 4) reason = "信号冲突";
            else if (c.level != null && c.level >= 3) reason = "冲突较高，需二次确认";
            else if (!readModelFull || frNonEmpty) reason = "读模型未齐套";
            else if (isHighRisk(d)) reason = "风险过高";
            else if (!vpOk || !invOk) reason = "入场区间或失效条件未齐套";

            return '<p class="detail-p">当前不建议给出入场区间</p><p class="detail-p"><span class="muted">原因：</span>' + reason + "</p>";
        }
        function planCell(raw) {
            if (raw == null) return "—";
            var t = String(raw).trim();
            if (t === "" || t === "暂无") return "—";
            return t;
        }
        var vp = d.validPeriod || "—";
        var inv = d.invalidCondition || "—";
        var ezRaw = d.entryZone != null ? d.entryZone : d.entry_zone;
        var slRaw = d.stopLoss != null ? d.stopLoss : d.stop_loss;
        var levRaw = d.leverageSuggestion != null ? d.leverageSuggestion : d.leverage_suggestion;
        var posRaw = d.positionSuggestion != null ? d.positionSuggestion : d.position_suggestion;
        var tpRaw = d.takeProfitRules != null ? d.takeProfitRules : d.take_profit_rules;
        var tpDisplay = planCell(tpRaw);
        var tpBodyHtml = tpDisplay === "—"
            ? '<span class="muted">—</span>'
            : escapeHtml(tpDisplay);
        return '<div class="detail-grid">' +
            '<div class="kv"><span class="k">当前价格</span><span class="v">' + escapeHtml(formatPrice(d.latestPrice != null ? d.latestPrice : d.latest_price)) + "</span></div>" +
            '<div class="kv"><span class="k">决策有效窗口（Decision）</span><span class="v">' + escapeHtml(vp) + "</span></div>" +
            '<div class="kv"><span class="k">追价上限 / 追空下限</span><span class="v">见执行要点与行情</span></div>' +
            '<div class="kv"><span class="k">失效条件</span><span class="v">' + escapeHtml(inv) + "</span></div>" +
            '<div class="kv"><span class="k">计划入场区间（Execution）</span><span class="v">' + escapeHtml(planCell(ezRaw)) + "</span></div>" +
            '<div class="kv"><span class="k">计划止损</span><span class="v">' + escapeHtml(planCell(slRaw)) + "</span></div>" +
            '<div class="kv"><span class="k">杠杆建议</span><span class="v">' + escapeHtml(planCell(levRaw)) + "</span></div>" +
            '<div class="kv"><span class="k">仓位建议</span><span class="v">' + escapeHtml(planCell(posRaw)) + "</span></div>" +
            '<div class="kv"><span class="k">风格</span><span class="v">均衡入场区间</span></div></div>' +
            '<div style="margin-top:10px;">' +
            '<p class="sec1-evidence-label">止盈规则（Execution 计划表）</p>' +
            '<p class="detail-p" style="margin-top:4px;white-space:pre-wrap;word-break:break-word;">' + tpBodyHtml + "</p></div>" +
            '<p class="detail-p muted" style="margin-top:10px;">执行要点（由决策有效窗口 + 失效条件派生）：' + escapeHtml(d.executionPlanSummary || "—") + "</p>";
    }

        return fetch("/api/position-monitor/open")
            .then(function (r) { return r.json().then(function (body) { return { ok: r.ok, body: body }; }); })
            .then(function (pack) {
                if (!pack.ok || !pack.body || pack.body.code !== 200) {
                    var msg = pack.body && pack.body.msg ? pack.body.msg : "position monitor open load failed";
                    throw new Error(msg);
                }
                positionMonitorOpenRows = Array.isArray(pack.body.data) ? pack.body.data : [];
                return positionMonitorOpenRows;
            })
            .catch(function (e) {
                // 不伪造数据：失败时保留旧状态（初始为空）
                alert("持仓监控列表加载失败，请稍后重试");

            });

    function getPositionRowByPositionId(positionId) {
        var target = String(positionId || "");
        var list = Array.isArray(positionMonitorOpenRows) ? positionMonitorOpenRows : [];
        for (var i = 0; i < list.length; i++) {
            var row = list[i];
            if (!row) continue;
            var rowPositionId = row.positionId != null ? row.positionId : (row.position_id != null ? row.position_id : (row.id != null ? row.id : ""));
            if (String(rowPositionId || "") === target) {
                return row;
            }
        }
        return null;
    }

    function saveManualPositionFromModal() {
        var symbol = (document.getElementById("mpSymbol").value || "").toString().trim().toUpperCase();
        var positionSide = (document.getElementById("mpPositionSide").value || "").toString().trim().toUpperCase();
        var avgOpenPriceRaw = document.getElementById("mpAvgOpenPrice").value;
        var positionQuantityRaw = document.getElementById("mpPositionQuantity").value;

        var errEl = document.getElementById("mpErrorMsg");
        if (errEl) errEl.textContent = "";

        if (!symbol) {
            if (errEl) errEl.textContent = "请先选择标的（selectedSymbol 为空）。";
            return;
        }
        if (positionSide !== "LONG" && positionSide !== "SHORT") {
            if (errEl) errEl.textContent = "持仓方向必须为 LONG/SHORT。";
            return;
        }

        var avgOpenPrice = Number(avgOpenPriceRaw);
        if (!isFinite(avgOpenPrice) || avgOpenPrice <= 0) {
            if (errEl) errEl.textContent = "开仓价 avgOpenPrice 必须 > 0。";
            return;
        }

        var payload = {
            symbol: symbol,
            positionSide: positionSide,
            avgOpenPrice: avgOpenPrice
        };

        if (positionQuantityRaw != null && String(positionQuantityRaw).trim() !== "") {
            var positionQuantity = Number(positionQuantityRaw);
            if (!isFinite(positionQuantity) || positionQuantity <= 0) {
                if (errEl) errEl.textContent = "持仓数量 positionQuantity 必须 > 0（如填写）。";
                return;
            }
            payload.positionQuantity = positionQuantity;
        }

        fetch("/api/positions/manual", {
            method: "POST",
            headers: { "Accept": "application/json", "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        })
            .then(function (r) { return r.json().then(function (body) { return { ok: r.ok, body: body }; }); })
            .then(function (pack) {
                if (!pack.ok || !pack.body || pack.body.code !== 200) {
                    var msg = pack.body && pack.body.msg ? pack.body.msg : "保存失败";
                    throw new Error(msg);
                }
                closeManualPositionModal();
                return loadPositionMonitorOpenRows().then(function () {
                    refreshPositionMonitorOpenRowsUI();
                });
            })
            .catch(function (e) {
                if (errEl) errEl.textContent = e && e.message ? e.message : "保存失败";
            });
    }

    function saveClosePositionFromModal() {
        var row = window.__closePositionModalRow;
        if (!row) return;

        var positionId = row.positionId != null ? row.positionId : row.position_id;
        if (!positionId) return;

        var errEl = document.getElementById("closePositionError");
        if (errEl) errEl.textContent = "";

        var exitPriceRaw = document.getElementById("cpExitPrice").value;
        var closeReason = (document.getElementById("cpCloseReason").value || "").toString().trim();
        var userActionType = (document.getElementById("cpUserActionType").value || "").toString().trim();
        var userRemark = (document.getElementById("cpUserRemark").value || "").toString();
        var exitPrice = Number(exitPriceRaw);

        if (!isFinite(exitPrice) || String(exitPriceRaw || "").trim() === "") {
            if (errEl) errEl.textContent = "请填写记录平仓价。";
            return;
        }
        if (exitPrice <= 0) {
            if (errEl) errEl.textContent = "记录平仓价必须大于 0。";
            return;
        }

        fetch("/api/positions/" + encodeURIComponent(positionId) + "/close", {
            method: "POST",
            headers: { "Accept": "application/json", "Content-Type": "application/json" },
            body: JSON.stringify({
                exitPrice: Number(exitPrice),
                closeReason: closeReason,
                userActionType: userActionType,
                userRemark: userRemark
            })
        })
            .then(function (r) { return r.json().then(function (body) { return { ok: r.ok, body: body }; }); })
            .then(function (pack) {
                if (!pack.ok || !pack.body || pack.body.code !== 200) {
                    throw new Error(pack.body && pack.body.msg ? pack.body.msg : "保存平仓记录失败");
                }
                closeClosePositionModal();
                window.__closePositionModalRow = null;
                return loadPositionMonitorOpenRows().then(function () {
                    refreshPositionMonitorOpenRowsUI();
                    alert("已记录平仓。");
                });
            })
            .catch(function (e) {
                if (errEl) errEl.textContent = e && e.message ? e.message : "网络错误，请稍后重试";
            });
    }

    function escapeHtmlSafe(v) {
        return String(v == null ? "" : v)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
    }

    function pickPositionField(row, camel, snake) {
        if (!row) return "";
        if (row[camel] != null) return row[camel];
        if (snake && row[snake] != null) return row[snake];
        return "";
    }

    function positionMonitorDisplayText(v, fallback) {
        if (v == null || String(v).trim() === "") return fallback || "—";
        return String(v).trim();
    }

    function renderPositionMonitorRowHtml(row) {
        var positionId = pickPositionField(row, "positionId", "position_id") || pickPositionField(row, "id", "id");
        var symbol = pickPositionField(row, "symbol", "symbol");
        var side = pickPositionField(row, "positionSide", "position_side");
        var avgOpenPrice = pickPositionField(row, "avgOpenPrice", "avg_open_price");
        var markPrice = pickPositionField(row, "markPrice", "mark_price");
        var unrealizedPnl = pickPositionField(row, "unrealizedPnlPct", "unrealized_pnl_pct");
        var latest = pickPositionField(row, "latestMonitorRecord", "latest_monitor_record");
        var hasMonitor = !!latest;
        var boundaryLabel = hasMonitor ? pickPositionField(latest, "boundaryStateLabel", "boundary_state_label") : "未返回";
        var actionText = hasMonitor
            ? pickPositionField(latest, "systemSuggestedAction", "system_suggested_action")
            : "点击复查生成";
        var riskText = hasMonitor ? pickPositionField(latest, "positionRiskLevel", "position_risk_level") : "暂无监控记录";
        var entryText = hasMonitor ? pickPositionField(latest, "entryLogicState", "entry_logic_state") : "暂无监控记录";
        var directionText = hasMonitor ? pickPositionField(latest, "directionSupportState", "direction_support_state") : "暂无监控记录";
        var reversalText = hasMonitor ? pickPositionField(latest, "reversalState", "reversal_state") : "暂无监控记录";
        var sideText = typeof positionSideText === "function" ? positionSideText(side) : positionMonitorDisplayText(side, "—");

        return '<tr class="position-monitor-row severity-neutral" data-symbol="' + escapeHtmlSafe(symbol) + '" data-position-id="' + escapeHtmlSafe(positionId) + '">' +
            '<td class="pm-symbol">' + escapeHtmlSafe(positionMonitorDisplayText(symbol, "—")) + '</td>' +
            '<td class="pm-side">' + escapeHtmlSafe(sideText) + '</td>' +
