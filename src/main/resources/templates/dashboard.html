            '<div class="kv"><span class="k">风险信号</span><span class="v">' + escapeHtml(riskLevelText(d.riskLevel)) + "</span></div>" +
            '<div class="kv"><span class="k">数据更新时间</span><span class="v">' + escapeHtml(priceUpdatedText !== "—" ? priceUpdatedText : formatDateTime(d.createTime)) + "</span></div>" +
            '<div class="kv"><span class="k">Asset Snapshot</span><span class="v">' + escapeHtml(assetSnapshot || "—") + "</span></div>" +
            '<div class="kv"><span class="k">ReadModel Fallback</span><span class="v">' + escapeHtml(readModelFallbackReason || "—") + "</span></div></div>" +
            (readModelFallbackReason ? '<div class="side-note">读取降级提示：' + escapeHtml(readModelFallbackReason) + "</div>" : "");

        var s6 = positionModule(d);

        document.getElementById("sec-s1").innerHTML = s1;
        document.getElementById("sec-s2").innerHTML = s2;
        document.getElementById("sec-s3").innerHTML = s3;
        document.getElementById("sec-s4").innerHTML = s4;
        document.getElementById("sec-s5").innerHTML = s5;
        document.getElementById("sec-s6").innerHTML = s6;
    }

    function wireNav() {
        var buttons = document.querySelectorAll(".nav-btn");
        var sections = { s1: "sec-s1", s2: "sec-s2", s3: "sec-s3", s4: "sec-s4", s5: "sec-s5", s6: "sec-s6" };
        function show(sec) {
            Object.keys(sections).forEach(function (k) {
                document.getElementById(sections[k]).classList.toggle("visible", k === sec);
            });
            buttons.forEach(function (b) {
                b.classList.toggle("active", b.getAttribute("data-section") === sec);
            });
        }
        showNavSection = show;
        buttons.forEach(function (b) {
            b.addEventListener("click", function () {
                show(b.getAttribute("data-section"));
            });
        });
        show("s1");
    }

    function refreshDashboard() {
        fetch("/api/dashboard/summary?limit=12")
            .then(function (r) { return r.ok ? r.json() : Promise.reject(r); })
            .then(function (data) {
                setRuntimeStatus(data.systemStatus ? data.systemStatus.status : "OK");
                window.__lastHealth = data.systemHealth;
                allDecisions = data.decisions || [];
                buildDisplayList();
                renderLayer1(data.systemStatus, data.systemHealth, data.alerts, allDecisions, data.openPositionCount);
                renderTiles();
                requestDetailForSelectedSymbol();
                document.getElementById("lastUpdatedText").textContent = nowText();
                fetchPositionProviderStatus();
                loadPositionMonitorOpenRows()
                    .then(function () { refreshPositionMonitorOpenRowsUI(); })
                    .catch(function () {});
            })
            .catch(function () {
                document.getElementById("lastUpdatedText").textContent = nowText();
            });
    }

    function requestDetailForSelectedSymbol() {
        var symbol = selectedSymbol;
        if (!symbol) return;
        fetch("/api/dashboard/detail?symbol=" + encodeURIComponent(symbol))
            .then(function (r) { return r.ok ? r.json() : Promise.reject(r); })
            .then(function (resp) {
                var detail = resp && resp.decision ? resp.decision : null;
                detailMarketEnvironmentMiniMap[symbol] = resp && resp.marketEnvironmentMini ? resp.marketEnvironmentMini : null;
                detailEvidenceTopItemsMap[symbol] = Array.isArray(resp && resp.evidenceTopItems) ? resp.evidenceTopItems : [];
                detailScoreTopItemsMap[symbol] = Array.isArray(resp && resp.scoreTopItems) ? resp.scoreTopItems : [];
                if (!detail || !detail.symbol) return;
                detailDecisionMap[detail.symbol] = detail;
                if (selectedSymbol === detail.symbol) {
                    renderDetail(
                        detail,
                        detailMarketEnvironmentMiniMap[detail.symbol],
                        detailEvidenceTopItemsMap[detail.symbol],
                        detailScoreTopItemsMap[detail.symbol]
                    );
                }
            })
            .catch(function () {
                // Keep summary row rendering when detail API is temporarily unavailable.
            });
    }

    function scheduleRefresh() {
        if (refreshTimer) clearInterval(refreshTimer);
        refreshTimer = null;
        if (REFRESH_MS > 0) refreshTimer = setInterval(refreshDashboard, REFRESH_MS);
    }

    document.getElementById("refreshInterval").addEventListener("change", function () {
        REFRESH_MS = parseInt(this.value, 10) || 0;
        scheduleRefresh();
    });

    document.getElementById("symbolSearch").addEventListener("input", function () {
        searchQuery = this.value;
        buildDisplayList();
        renderTiles();
    });

    document.getElementById("modeSelect").addEventListener("change", function () {
        modeValue = this.value;
        try { localStorage.setItem(MODE_LS_KEY, modeValue); } catch (e) {}
        updateModeHint();
        buildDisplayList();
        renderTiles();
    });

    document.getElementById("btnReset").addEventListener("click", function () {
        searchQuery = "";
        document.getElementById("symbolSearch").value = "";
        modeValue = "system";
        document.getElementById("modeSelect").value = "system";
        try { localStorage.setItem(MODE_LS_KEY, "system"); } catch (e) {}
        updateModeHint();
        buildDisplayList();
        renderTiles();
    });

    document.getElementById("btnAdd").addEventListener("click", function () {
        var raw = (document.getElementById("symbolSearch").value || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
        if (!raw) {
            alert("请输入币种代码，例如 BTCUSDT");
            return;
        }
        if (modeValue !== "custom") {
            alert("请先切换到「自定义监控」，再将标的加入本机列表（仅存浏览器）。");
            return;
        }
        var cur = loadCustomSymbols();
        if (cur.indexOf(raw) < 0) cur.push(raw);
        saveCustomSymbols(cur);
        updateModeHint();
        buildDisplayList();
        renderTiles();
    });

    document.addEventListener("click", function (evt) {
        var entryBtn = evt.target && evt.target.closest ? evt.target.closest(".manual-position-entry-btn") : null;
        if (entryBtn) {
            openManualPositionModal();
            return;
        }

        var saveBtn = evt.target && evt.target.closest ? evt.target.closest("#mpSaveBtn") : null;
        if (saveBtn) {
            saveManualPositionFromModal();
            return;
        }

        var closeSaveBtn = evt.target && evt.target.closest ? evt.target.closest("#cpSaveBtn") : null;
        if (closeSaveBtn) {
            saveClosePositionFromModal();
            return;
        }

        var closeBtn = evt.target && evt.target.closest ? evt.target.closest("[data-action='manual-close-position']") : null;
        if (closeBtn) {
            evt.stopPropagation();
            var positionId = closeBtn.getAttribute("data-position-id");
            if (!positionId) {
                var rowEl = closeBtn.closest(".position-monitor-row");
                positionId = rowEl ? rowEl.getAttribute("data-position-id") : "";
            }
            var row = getPositionRowByPositionId(positionId);
            if (!row) {
                alert("未找到该持仓记录，请稍后刷新后重试。");
                return;
            }
            openClosePositionModal(row);
            return;
        }

        var monitorBtn = evt.target && evt.target.closest ? evt.target.closest("[data-action='manual-run-position-monitor']") : null;
        if (monitorBtn) {
            evt.stopPropagation();
            var monitorPositionId = monitorBtn.getAttribute("data-position-id");
            if (!monitorPositionId) {
                var monitorRowEl = monitorBtn.closest(".position-monitor-row");
                monitorPositionId = monitorRowEl ? monitorRowEl.getAttribute("data-position-id") : "";
            }
            if (!monitorPositionId) {
                alert("无法识别该持仓ID，请刷新页面后重试。");
                return;
            }
            fetch("/api/position-monitor/" + encodeURIComponent(monitorPositionId) + "/run", { method: "POST" })
                .then(function (r) { return r.json().then(function (body) { return { ok: r.ok, body: body }; }); })
                .then(function (pack) {
                    if (!pack.ok || !pack.body || pack.body.code !== 200) {
                        throw new Error(pack.body && pack.body.msg ? pack.body.msg : "复查失败");
                    }
                    return loadPositionMonitorOpenRows().then(function () {
                        refreshPositionMonitorOpenRowsUI();
                    });
                })
                .catch(function (e) {
                    alert(e && e.message ? e.message : "复查失败");
                });
        }
    });

    document.getElementById("helpBtn").addEventListener("click", function () {
        alert("TRINE LOGIC (V1)\n\n· 系统推荐：中层展示决策时间倒序前 6 条\n· 自定义监控：仅展示已加入本机列表的标的（localStorage）\n· 点击币块查看下方详情 · 右上角可调自动刷新");
    });

    document.getElementById("themeBtn").addEventListener("click", function () {
        toggleTheme();
    });

    document.getElementById("settingsBtn").addEventListener("click", function () {
        alert("系统设置占位：后续可接用户偏好。");
    });

    function toggleTheme() {
        var root = document.documentElement;
        var btn = document.getElementById("themeBtn");
        if (root.getAttribute("data-theme") === "dark") {
            root.removeAttribute("data-theme");
            localStorage.setItem("theme", "light");
            btn.textContent = "夜间主题";
        } else {
            root.setAttribute("data-theme", "dark");
            localStorage.setItem("theme", "dark");
            btn.textContent = "白天主题";
        }
    }

    window.refreshDashboard = refreshDashboard;
    window.toggleTheme = toggleTheme;

    window.addEventListener("DOMContentLoaded", function () {
        if (localStorage.getItem("theme") === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
            document.getElementById("themeBtn").textContent = "白天主题";
        }
        try {
            var sm = localStorage.getItem(MODE_LS_KEY);
            if (sm === "system" || sm === "custom") {
                modeValue = sm;
                document.getElementById("modeSelect").value = modeValue;
            }
        } catch (e) {}
        updateModeHint();
        wireNav();
        document.getElementById("lastUpdatedText").textContent = nowText();
        refreshDashboard();
        REFRESH_MS = 30000;
        scheduleRefresh();
    });
})();
    </script>
</body>
</html>
