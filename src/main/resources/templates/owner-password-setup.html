<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>设置 Owner 密码 · TRINE LOGIC</title>
    <link rel="stylesheet" th:href="@{/css/login.css}" href="/css/login.css">
</head>
<body>
<main class="login-shell">
    <section class="login-panel" aria-labelledby="setup-title">
        <div class="brand-mark" aria-hidden="true"></div>
        <h1 id="setup-title">设置 Owner 密码</h1>
        <div class="login-message login-message-error" th:if="${setupError}" th:text="${setupError}" role="alert"></div>
        <form class="login-form" th:action="@{/owner/password-setup}" method="post">
            <input type="hidden" name="token" th:value="${setupToken}">
            <label for="password">新密码</label>
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required autofocus>
            <label for="passwordConfirmation">确认新密码</label>
            <input id="passwordConfirmation" name="passwordConfirmation" type="password" autocomplete="new-password" minlength="8" maxlength="128" required>
            <label class="password-visibility"><input type="checkbox" data-password-toggle data-password-targets="password,passwordConfirmation"> 显示密码</label>
            <button type="submit">确认设置</button>
        </form>
    </section>
</main>
<script th:src="@{/js/auth-forms.js}" src="/js/auth-forms.js" defer></script>
</body>
</html>
