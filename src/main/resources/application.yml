server:
  port: 8081
  address: 0.0.0.0
  servlet:
    session:
      timeout: ${TRADE_MODEL_SESSION_TIMEOUT:30m}
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: lax
        secure: ${TRADE_MODEL_SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: trade-model-v1

  session:
    jdbc:
      initialize-schema: embedded

  # H2 development uses schema.sql. Production explicitly enables the single
  # versioned Flyway owner in application-prod.yml.
  flyway:
    enabled: false

  datasource:
    url: jdbc:h2:mem:trade_model_v1;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: org.example.trademodel.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    org.example.trademodel: DEBUG
    org.example.trademodel.mapper.PersonalUserMapper: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,personalUserBootstrap
      show-details: never
      show-components: never

trade-model:
  telegram:
    enabled: ${TRADE_MODEL_TELEGRAM_ENABLED:false}
    external-calls-enabled: ${TRADE_MODEL_TELEGRAM_EXTERNAL_CALLS_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
    api-base-url: ${TELEGRAM_API_BASE_URL:https://api.telegram.org}
    public-base-url: ${TRADE_MODEL_PUBLIC_BASE_URL:}
    connect-timeout-ms: ${TRADE_MODEL_TELEGRAM_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${TRADE_MODEL_TELEGRAM_READ_TIMEOUT_MS:5000}
    max-attempts: ${TRADE_MODEL_TELEGRAM_MAX_ATTEMPTS:5}
    retry-base-seconds: ${TRADE_MODEL_TELEGRAM_RETRY_BASE_SECONDS:5}
    retry-max-seconds: ${TRADE_MODEL_TELEGRAM_RETRY_MAX_SECONDS:300}
    delivery-batch-size: ${TRADE_MODEL_TELEGRAM_DELIVERY_BATCH_SIZE:20}
    dispatch-enabled: ${TRADE_MODEL_TELEGRAM_DISPATCH_ENABLED:false}
    dispatch-fixed-delay-ms: ${TRADE_MODEL_TELEGRAM_DISPATCH_FIXED_DELAY_MS:5000}
    claim-lease-seconds: ${TRADE_MODEL_TELEGRAM_CLAIM_LEASE_SECONDS:60}
    cooldown-minutes: ${TRADE_MODEL_TELEGRAM_COOLDOWN_MINUTES:15}
    allow-high-quality-reduced: ${TRADE_MODEL_TELEGRAM_ALLOW_HIGH_QUALITY_REDUCED:false}
  provider-call:
    enabled: ${TRADE_MODEL_PROVIDER_CALL_ENABLED:false}
    scheduler-enabled: ${TRADE_MODEL_PROVIDER_SCAN_SCHEDULER_ENABLED:false}
    profile-escalation-enabled: ${TRADE_MODEL_PROFILE_ESCALATION_ENABLED:false}
    external-calls-enabled: ${TRADE_MODEL_PROVIDER_EXTERNAL_CALLS_ENABLED:false}
    base-profile: ${TRADE_MODEL_PROVIDER_BASE_PROFILE:AUTO}
    auto-escalation-enabled: ${TRADE_MODEL_PROVIDER_AUTO_ESCALATION_ENABLED:true}
    internal-budget-ratio: 0.80
    emergency-reserve-ratio: 0.20
    event-refresh-min-gap-seconds: 40
    per-symbol-minimum-gap-seconds: 1
    max-watchlist-assets: 20
    max-candidate-assets: 20
    max-discovery-assets: 20
    max-concurrent-provider-calls: 8
    max-concurrent-ai-calls: 3
    max-queued-calls: 32
    reserved-priority-slots: 2
    global-advertised-requests-per-minute: 1500
    notification:
      opportunity-scope: WATCHLIST_AND_DISCOVERY
    scan-user-id: ${TRADE_MODEL_PROVIDER_SCAN_USER_ID:admin}
    failure-threshold: 3
    circuit-open-seconds: 60
    provider-budgets:
      binance-public-advertised-rpm: 1200
      coinglass-advertised-rpm: ${COINGLASS_ADVERTISED_RPM:}
      ai-advertised-rpm: 60
      external-context-advertised-rpm: 60
    profiles:
      low:
        price: { position-seconds: 15, watchlist-seconds: 60, candidate-seconds: 120, discovery-seconds: 900 }
        ohlcv: { position-seconds: 60, watchlist-seconds: 300, candidate-seconds: 300, discovery-seconds: 900 }
        derivatives: { position-seconds: 120, watchlist-seconds: 120, candidate-seconds: 300, discovery-seconds: 900 }
        external-context-seconds: 900
        full-analysis-debounce-seconds: 300
        ai-checkpoint-debounce-seconds: 300
      standard:
        price: { position-seconds: 10, watchlist-seconds: 30, candidate-seconds: 60, discovery-seconds: 600 }
        ohlcv: { position-seconds: 60, watchlist-seconds: 180, candidate-seconds: 180, discovery-seconds: 600 }
        derivatives: { position-seconds: 60, watchlist-seconds: 60, candidate-seconds: 120, discovery-seconds: 600 }
        external-context-seconds: 600
        full-analysis-debounce-seconds: 60
        ai-checkpoint-debounce-seconds: 120
      high:
        price: { position-seconds: 5, watchlist-seconds: 15, candidate-seconds: 30, discovery-seconds: 300 }
        ohlcv: { position-seconds: 60, watchlist-seconds: 120, candidate-seconds: 120, discovery-seconds: 300 }
        derivatives: { position-seconds: 60, watchlist-seconds: 60, candidate-seconds: 60, discovery-seconds: 300 }
        external-context-seconds: 300
        full-analysis-debounce-seconds: 20
        ai-checkpoint-debounce-seconds: 60
      emergency:
        price: { position-seconds: 3, watchlist-seconds: 5, candidate-seconds: 10, discovery-seconds: 900 }
        ohlcv: { position-seconds: 60, watchlist-seconds: 60, candidate-seconds: 60, discovery-seconds: 900 }
        derivatives: { position-seconds: 40, watchlist-seconds: 40, candidate-seconds: 40, discovery-seconds: 900 }
        external-context-seconds: 120
        full-analysis-debounce-seconds: 20
        ai-checkpoint-debounce-seconds: 60
    profile-transition:
      high-min-hold-seconds: 300
      emergency-min-hold-seconds: 120
      recovery-confirm-cycles: 2
      downgrade-cooldown-seconds: 300
  watchlist:
    max-assets: 20
    venue: BINANCE
    market-type: PERPETUAL
    contract-type: LINEAR
  discovery:
    enabled: ${TRADE_MODEL_DISCOVERY_ENABLED:true}
    max-assets: 20
    venue: BINANCE
    market-type: PERPETUAL
    contract-type: LINEAR
  candidate-promotion:
    promotion-confirmation-cycles: 2
    minimum-candidate-hold-seconds: 300
    candidate-ttl-seconds: 3600
    promotion-cooldown-seconds: 300
    retrigger-cooldown-seconds: 900
    degradation-confirmation-cycles: 2
  fundamental-ai-v4-1:
    ranking:
      home-capacity: 6
      freshness-window-seconds: 3600
      minimum-data-quality: 70
      opportunity-score-weight: 0.30
      confidence-weight: 0.15
      risk-weight: 0.10
      plan-mode-weight: 0.15
      data-quality-weight: 0.10
      freshness-weight: 0.05
      conflict-weight: 0.07
      stability-weight: 0.05
      direction-strength-weight: 0.30
      final-confidence-weight: 0.25
      one-hour-opportunity-weight: 0.20
      four-hour-alignment-weight: 0.10
      execution-feasibility-weight: 0.10
      replacement-threshold: 5
    opportunity-state:
      minimum-dwell-seconds: 300
      cooling-seconds: 900
      candidate-promotion-score: 70
      confused-enter-threshold: 70
      directional-push-block-threshold: 85
    ai-gate:
      minimum-data-quality: 85
      circuit-breaker-score: 70
      minimum-significant-evidence-strength: 60
      cache-ttl-seconds: 300
      cache-max-entries: 500
      per-run-token-limit: 24000
      per-asset-cooldown-seconds: 300
      hourly-call-limit: 180
      hourly-token-limit: 1440000
      daily-call-limit: 1200
      daily-token-limit: 9600000
      daily-cost-micros-limit: 100000000
      concurrency-limit: 3
      max-retry-per-role: 1
    multi-timeframe:
      four-hour-weight: 0.57
      one-hour-weight: 0.43
      fifteen-minute-weight: 0.00
      five-minute-weight: 0.00
      minimum-aligned-count: 2
      minimum-aligned-weight: 1.00
      maximum-trend-score-difference: 15
    normalization:
      version: V41-NORM-WREP-1
      lookback: 200
      minimum-sample-count: 60
      winsorize-lower-percentile: 2.5
      winsorize-upper-percentile: 97.5
    provider-matrix:
      version: V41-PROVIDER-MATRIX-1
      ohlcv-requirement: MANDATORY
      derivatives-requirement: OPTIONAL
      five-minute-ttl-seconds: 600
      fifteen-minute-ttl-seconds: 1800
      one-hour-ttl-seconds: 7200
      four-hour-ttl-seconds: 28800
    account-risk:
      low-max-exposure: 0.30
      medium-max-exposure: 0.20
      high-max-exposure: 0.10
      extreme-max-exposure: 0.05
      max-leverage: 10
      freshness-seconds: 300
    execution-feasibility:
      quote-freshness-seconds: ${TRADE_MODEL_EXECUTION_QUOTE_FRESHNESS_SECONDS:30}
      max-spread-bps: ${TRADE_MODEL_EXECUTION_MAX_SPREAD_BPS:15}
      minimum-top-of-book-notional: ${TRADE_MODEL_EXECUTION_MIN_TOP_BOOK_NOTIONAL:10000}
      max-entry-drift-bps: ${TRADE_MODEL_EXECUTION_MAX_ENTRY_DRIFT_BPS:10}
  instruments:
    default-supported-timeframes: [5m, 15m, 1h, 4h]
    default-verified-at: ${TRADE_MODEL_INSTRUMENT_REGISTRY_VERIFIED_AT:2026-08-15T00:00:00Z}
    capability-freshness-seconds: ${TRADE_MODEL_INSTRUMENT_CAPABILITY_FRESHNESS_SECONDS:2592000}
    mappings:
      - { provider: BINANCE, base-asset: BTC, quote-asset: USDT, market-type: SPOT, venue: BINANCE, contract-type: NONE, provider-symbol: BTCUSDT, source-version: BINANCE_SPOT_V1 }
      - { provider: BINANCE, base-asset: BTC, quote-asset: USDT, market-type: PERPETUAL, venue: BINANCE, contract-type: LINEAR, provider-symbol: BTCUSDT, source-version: BINANCE_USDM_V1 }
      - { provider: COINGLASS, base-asset: BTC, quote-asset: USDT, market-type: PERPETUAL, venue: BINANCE, contract-type: LINEAR, provider-symbol: BTCUSDT, source-version: COINGLASS_V4_V1 }
      - { provider: BINANCE, base-asset: ETH, quote-asset: USDT, market-type: SPOT, venue: BINANCE, contract-type: NONE, provider-symbol: ETHUSDT, source-version: BINANCE_SPOT_V1 }
      - { provider: BINANCE, base-asset: ETH, quote-asset: USDT, market-type: PERPETUAL, venue: BINANCE, contract-type: LINEAR, provider-symbol: ETHUSDT, source-version: BINANCE_USDM_V1 }
      - { provider: COINGLASS, base-asset: ETH, quote-asset: USDT, market-type: PERPETUAL, venue: BINANCE, contract-type: LINEAR, provider-symbol: ETHUSDT, source-version: COINGLASS_V4_V1 }
      - { provider: BINANCE, base-asset: SOL, quote-asset: USDT, market-type: SPOT, venue: BINANCE, contract-type: NONE, provider-symbol: SOLUSDT, source-version: BINANCE_SPOT_V1 }
      - { provider: BINANCE, base-asset: SOL, quote-asset: USDT, market-type: PERPETUAL, venue: BINANCE, contract-type: LINEAR, provider-symbol: SOLUSDT, source-version: BINANCE_USDM_V1 }
      - { provider: COINGLASS, base-asset: SOL, quote-asset: USDT, market-type: PERPETUAL, venue: BINANCE, contract-type: LINEAR, provider-symbol: SOLUSDT, source-version: COINGLASS_V4_V1 }
      - { provider: BINANCE, base-asset: BNB, quote-asset: USDT, market-type: SPOT, venue: BINANCE, contract-type: NONE, provider-symbol: BNBUSDT, source-version: BINANCE_SPOT_V1 }
      - { provider: BINANCE, base-asset: BNB, quote-asset: USDT, market-type: PERPETUAL, venue: BINANCE, contract-type: LINEAR, provider-symbol: BNBUSDT, source-version: BINANCE_USDM_V1 }
      - { provider: COINGLASS, base-asset: BNB, quote-asset: USDT, market-type: PERPETUAL, venue: BINANCE, contract-type: LINEAR, provider-symbol: BNBUSDT, source-version: COINGLASS_V4_V1 }
      - { provider: BINANCE, base-asset: XRP, quote-asset: USDT, market-type: SPOT, venue: BINANCE, contract-type: NONE, provider-symbol: XRPUSDT, source-version: BINANCE_SPOT_V1 }
      - { provider: BINANCE, base-asset: XRP, quote-asset: USDT, market-type: PERPETUAL, venue: BINANCE, contract-type: LINEAR, provider-symbol: XRPUSDT, source-version: BINANCE_USDM_V1 }
      - { provider: COINGLASS, base-asset: XRP, quote-asset: USDT, market-type: PERPETUAL, venue: BINANCE, contract-type: LINEAR, provider-symbol: XRPUSDT, source-version: COINGLASS_V4_V1 }
      - { provider: BINANCE, base-asset: ADA, quote-asset: USDT, market-type: SPOT, venue: BINANCE, contract-type: NONE, provider-symbol: ADAUSDT, source-version: BINANCE_SPOT_EXCHANGE_INFO_V1 }
      - { provider: BINANCE, base-asset: ADA, quote-asset: USDT, market-type: PERPETUAL, venue: BINANCE, contract-type: LINEAR, provider-symbol: ADAUSDT, source-version: BINANCE_USDM_EXCHANGE_INFO_V1 }
      - { provider: COINGLASS, base-asset: ADA, quote-asset: USDT, market-type: PERPETUAL, venue: BINANCE, contract-type: LINEAR, provider-symbol: ADAUSDT, source-version: COINGLASS_V4_V1 }
      - { provider: BINANCE, base-asset: DOGE, quote-asset: USDT, market-type: SPOT, venue: BINANCE, contract-type: NONE, provider-symbol: DOGEUSDT, source-version: BINANCE_SPOT_V1 }
      - { provider: BINANCE, base-asset: DOGE, quote-asset: USDT, market-type: PERPETUAL, venue: BINANCE, contract-type: LINEAR, provider-symbol: DOGEUSDT, source-version: BINANCE_USDM_V1 }
      - { provider: COINGLASS, base-asset: DOGE, quote-asset: USDT, market-type: PERPETUAL, venue: BINANCE, contract-type: LINEAR, provider-symbol: DOGEUSDT, source-version: COINGLASS_V4_V1 }
  providers:
    coinglass:
      enabled: ${TRADE_MODEL_COINGLASS_ENABLED:false}
      external-calls-enabled: ${TRADE_MODEL_COINGLASS_EXTERNAL_CALLS_ENABLED:${TRADE_MODEL_PROVIDER_EXTERNAL_CALLS_ENABLED:false}}
      api-key: ${COINGLASS_API_KEY:}
      base-url: ${COINGLASS_API_BASE_URL:https://open-api-v4.coinglass.com}
      auth-header-name: ${COINGLASS_API_AUTH_HEADER:CG-API-KEY}
      advertised-rpm: ${COINGLASS_ADVERTISED_RPM:}
      internal-budget-ratio: 0.80
      request-timeout-ms: 5000
      # Keep the composite snapshot fresh for the slowest authorized LOW-profile
      # derivatives cadence. A shorter TTL creates a false stale window between
      # the 60s component TTL and the 120s watchlist refresh interval.
      fresh-ttl-seconds: ${TRADE_MODEL_COINGLASS_FRESH_TTL_SECONDS:120}
      stale-ttl-seconds: ${TRADE_MODEL_COINGLASS_STALE_TTL_SECONDS:360}
      emergency-min-refresh-gap-seconds: 40
      max-retry-5xx: 2
      max-retry-timeout: 1
  auth:
    enabled: ${TRADE_MODEL_AUTH_ENABLED:true}
    initial-username: ${TRADE_MODEL_INITIAL_USERNAME:}
    initial-password: ${TRADE_MODEL_INITIAL_PASSWORD:}
    login-attempts:
      failure-threshold: ${TRADE_MODEL_LOGIN_FAILURE_THRESHOLD:5}
      window-minutes: ${TRADE_MODEL_LOGIN_FAILURE_WINDOW_MINUTES:15}
      lock-minutes: ${TRADE_MODEL_LOGIN_LOCK_MINUTES:15}
      max-tracked-usernames: ${TRADE_MODEL_LOGIN_MAX_TRACKED_USERNAMES:1024}
  security:
    rate-limit:
      enabled: ${TRADE_MODEL_SECURITY_RATE_LIMIT_ENABLED:true}
      requests-per-minute: ${TRADE_MODEL_SECURITY_RATE_LIMIT_RPM:1200}
      window-ms: ${TRADE_MODEL_SECURITY_RATE_LIMIT_WINDOW_MS:60000}
  schedulers:
    enabled: ${TRADE_MODEL_SCHEDULERS_ENABLED:false}
    push-recheck:
      enabled: ${TRADE_MODEL_PUSH_RECHECK_SCHEDULER_ENABLED:false}
    position-sync:
      enabled: ${TRADE_MODEL_POSITION_SYNC_SCHEDULER_ENABLED:false}
    position-monitor:
      enabled: ${TRADE_MODEL_POSITION_MONITOR_SCHEDULER_ENABLED:false}
      initial-delay-ms: ${TRADE_MODEL_POSITION_MONITOR_INITIAL_DELAY_MS:15000}
      fixed-rate-ms: ${TRADE_MODEL_POSITION_MONITOR_FIXED_RATE_MS:30000}
    market-data:
      enabled: ${TRADE_MODEL_MARKET_DATA_SCHEDULER_ENABLED:false}
    ohlcv-ingestion:
      enabled: ${TRADE_MODEL_OHLCV_INGESTION_SCHEDULER_ENABLED:false}
      initial-delay-ms: ${TRADE_MODEL_OHLCV_INGESTION_INITIAL_DELAY_MS:60000}
      fixed-delay-ms: ${TRADE_MODEL_OHLCV_INGESTION_FIXED_DELAY_MS:60000}
      symbols: ${TRADE_MODEL_OHLCV_INGESTION_SYMBOLS:}
      timeframes: ${TRADE_MODEL_OHLCV_INGESTION_TIMEFRAMES:5m,15m,1h,4h}
      bar-limit: ${TRADE_MODEL_OHLCV_INGESTION_BAR_LIMIT:100}
      max-symbols: ${TRADE_MODEL_OHLCV_INGESTION_MAX_SYMBOLS:6}
      retry-base-seconds: ${TRADE_MODEL_OHLCV_INGESTION_RETRY_BASE_SECONDS:15}
      retry-max-seconds: ${TRADE_MODEL_OHLCV_INGESTION_RETRY_MAX_SECONDS:300}
    watchlist:
      enabled: ${TRADE_MODEL_WATCHLIST_SCHEDULER_ENABLED:false}
  analysis:
    scheduler:
      enabled: ${TRADE_MODEL_ANALYSIS_SCHEDULER_ENABLED:false}
      initial-delay-ms: ${TRADE_MODEL_ANALYSIS_SCHEDULER_INITIAL_DELAY_MS:60000}
      fixed-delay-ms: ${TRADE_MODEL_ANALYSIS_SCHEDULER_FIXED_DELAY_MS:60000}
      # Compatibility-only binding. Persistent analysis symbols come from Asset Pool.
      symbols: ${TRADE_MODEL_ANALYSIS_SCHEDULER_SYMBOLS:}
      timeframes: ${TRADE_MODEL_ANALYSIS_SCHEDULER_TIMEFRAMES:5m,15m,1h,4h}
      decision-timeframe: ${TRADE_MODEL_ANALYSIS_DECISION_TIMEFRAME:5m}
      required-market-timeframes: ${TRADE_MODEL_ANALYSIS_REQUIRED_MARKET_TIMEFRAMES:5m,15m,1h,4h}
      required-closed-bars: ${TRADE_MODEL_ANALYSIS_REQUIRED_CLOSED_BARS:100}
      observing-interval-seconds: ${TRADE_MODEL_ANALYSIS_OBSERVING_INTERVAL_SECONDS:900}
      candidate-interval-seconds: ${TRADE_MODEL_ANALYSIS_CANDIDATE_INTERVAL_SECONDS:300}
      waiting-trigger-interval-seconds: ${TRADE_MODEL_ANALYSIS_WAITING_TRIGGER_INTERVAL_SECONDS:120}
      triggered-interval-seconds: ${TRADE_MODEL_ANALYSIS_TRIGGERED_INTERVAL_SECONDS:60}
      high-risk-interval-seconds: ${TRADE_MODEL_ANALYSIS_HIGH_RISK_INTERVAL_SECONDS:60}
      invalidated-interval-seconds: ${TRADE_MODEL_ANALYSIS_INVALIDATED_INTERVAL_SECONDS:900}
      cooling-interval-seconds: ${TRADE_MODEL_ANALYSIS_COOLING_INTERVAL_SECONDS:900}
      confused-interval-seconds: ${TRADE_MODEL_ANALYSIS_CONFUSED_INTERVAL_SECONDS:120}
    idempotency:
      lease-seconds: ${TRADE_MODEL_ANALYSIS_IDEMPOTENCY_LEASE_SECONDS:120}
      max-recovery-attempts: ${TRADE_MODEL_ANALYSIS_IDEMPOTENCY_MAX_RECOVERY_ATTEMPTS:3}
  ohlcv:
    future-tolerance-ms: ${TRADE_MODEL_OHLCV_FUTURE_TOLERANCE_MS:30000}
    freshness-tolerance-ms: ${TRADE_MODEL_OHLCV_FRESHNESS_TOLERANCE_MS:30000}
    public-provider:
      enabled: ${TRADE_MODEL_PUBLIC_OHLCV_PROVIDER_ENABLED:false}
      external-calls-enabled: ${TRADE_MODEL_PUBLIC_OHLCV_EXTERNAL_CALLS_ENABLED:false}
    provider:
      primary: ${TRADE_MODEL_OHLCV_PRIMARY_PROVIDER:binance}
      fallback: ${TRADE_MODEL_OHLCV_FALLBACK_PROVIDER:kraken}
      fallback-enabled: ${TRADE_MODEL_OHLCV_FALLBACK_ENABLED:false}
    kraken:
      enabled: ${TRADE_MODEL_KRAKEN_OHLCV_ENABLED:false}
      external-calls-enabled: ${TRADE_MODEL_KRAKEN_OHLCV_EXTERNAL_CALLS_ENABLED:false}
      base-url: ${TRADE_MODEL_KRAKEN_OHLCV_BASE_URL:https://api.kraken.com}
    binance:
      enabled: ${TRADE_MODEL_BINANCE_OHLCV_ENABLED:${TRADE_MODEL_PUBLIC_OHLCV_PROVIDER_ENABLED:false}}
      external-calls-enabled: ${TRADE_MODEL_BINANCE_OHLCV_EXTERNAL_CALLS_ENABLED:${TRADE_MODEL_PUBLIC_OHLCV_EXTERNAL_CALLS_ENABLED:false}}
  ai:
    enabled: ${TRADE_MODEL_AI_ENABLED:false}
    request-timeout-ms: ${TRADE_MODEL_AI_REQUEST_TIMEOUT_MS:5000}
    overall-timeout-ms: ${TRADE_MODEL_AI_OVERALL_TIMEOUT_MS:8000}
    max-input-chars: ${TRADE_MODEL_AI_MAX_INPUT_CHARS:24000}
    max-output-tokens: ${TRADE_MODEL_AI_MAX_OUTPUT_TOKENS:500}
    max-concurrent-calls: ${TRADE_MODEL_AI_MAX_CONCURRENT_CALLS:3}
    max-queued-calls: ${TRADE_MODEL_AI_MAX_QUEUED_CALLS:3}
    per-asset-role-min-interval-ms: ${TRADE_MODEL_AI_PER_ASSET_ROLE_MIN_INTERVAL_MS:1000}
    provider-timeouts:
      openai-ms: ${TRADE_MODEL_AI_OPENAI_TIMEOUT_MS:10000}
      gemini-ms: ${TRADE_MODEL_AI_GEMINI_TIMEOUT_MS:25000}
      xai-ms: ${TRADE_MODEL_AI_XAI_TIMEOUT_MS:10000}
      overall-ms: ${TRADE_MODEL_AI_OVERALL_TIMEOUT_MS:30000}
    background-execution:
      enabled: ${TRADE_MODEL_AI_BACKGROUND_EXECUTION_ENABLED:true}
      submit-ack-timeout-ms: ${TRADE_MODEL_AI_OPENAI_ACK_TIMEOUT_MS:30000}
      gpt-job-deadline-ms: ${TRADE_MODEL_AI_GPT_JOB_DEADLINE_MS:180000}
      review-job-deadline-ms: ${TRADE_MODEL_AI_REVIEW_JOB_DEADLINE_MS:120000}
      chain-deadline-ms: ${TRADE_MODEL_AI_CHAIN_DEADLINE_MS:300000}
      initial-poll-interval-ms: ${TRADE_MODEL_AI_INITIAL_POLL_INTERVAL_MS:2000}
      max-poll-interval-ms: ${TRADE_MODEL_AI_MAX_POLL_INTERVAL_MS:10000}
      max-transient-retries: ${TRADE_MODEL_AI_MAX_TRANSIENT_RETRIES:1}
      structured-max-output-tokens: ${TRADE_MODEL_AI_STRUCTURED_MAX_OUTPUT_TOKENS:4000}
      reasoning-effort: ${TRADE_MODEL_AI_GPT_REASONING_EFFORT:medium}
      text-verbosity: ${TRADE_MODEL_AI_GPT_TEXT_VERBOSITY:low}
    daily-budget-usd: ${TRADE_MODEL_AI_DAILY_BUDGET_USD:}
    per-analysis-budget-usd: ${TRADE_MODEL_AI_PER_ANALYSIS_BUDGET_USD:}
    readiness-verification-ttl-seconds: ${TRADE_MODEL_AI_READINESS_VERIFICATION_TTL_SECONDS:3600}
    model-strategy:
      gpt-final:
        priority: ${TRADE_MODEL_AI_GPT_FINAL_PRIORITY:QUALITY_FIRST}
      gemini-review:
        priority: ${TRADE_MODEL_AI_GEMINI_REVIEW_PRIORITY:BALANCED}
      grok-challenge:
        priority: ${TRADE_MODEL_AI_GROK_CHALLENGE_PRIORITY:CHALLENGE_FIRST}
    openai:
      enabled: ${TRADE_MODEL_AI_OPENAI_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
