server:
  port: 8081
  address: 0.0.0.0

spring:
  application:
    name: trade-model-v1

  datasource:
    url: jdbc:h2:mem:trade_model_v1;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: org.example.trademodel.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    org.example.trademodel: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never

trade-model:
  auth:
    enabled: ${TRADE_MODEL_AUTH_ENABLED:true}
    admin-username: ${APP_ADMIN_USERNAME:admin}
    admin-password: ${APP_ADMIN_PASSWORD:dev-local-password}
  security:
    rate-limit:
      enabled: ${TRADE_MODEL_SECURITY_RATE_LIMIT_ENABLED:true}
      requests-per-minute: ${TRADE_MODEL_SECURITY_RATE_LIMIT_RPM:1200}
      window-ms: ${TRADE_MODEL_SECURITY_RATE_LIMIT_WINDOW_MS:60000}
  schedulers:
    enabled: ${TRADE_MODEL_SCHEDULERS_ENABLED:true}
    push-recheck:
      enabled: ${TRADE_MODEL_PUSH_RECHECK_SCHEDULER_ENABLED:true}
    position-sync:
      enabled: ${TRADE_MODEL_POSITION_SYNC_SCHEDULER_ENABLED:true}
    position-monitor:
      enabled: ${TRADE_MODEL_POSITION_MONITOR_SCHEDULER_ENABLED:false}
      initial-delay-ms: ${TRADE_MODEL_POSITION_MONITOR_INITIAL_DELAY_MS:15000}
      fixed-rate-ms: ${TRADE_MODEL_POSITION_MONITOR_FIXED_RATE_MS:30000}
    market-data:
      enabled: ${TRADE_MODEL_MARKET_DATA_SCHEDULER_ENABLED:true}
    ohlcv-ingestion:
      enabled: ${TRADE_MODEL_OHLCV_INGESTION_SCHEDULER_ENABLED:false}
      initial-delay-ms: ${TRADE_MODEL_OHLCV_INGESTION_INITIAL_DELAY_MS:60000}
      fixed-delay-ms: ${TRADE_MODEL_OHLCV_INGESTION_FIXED_DELAY_MS:60000}
      symbols: ${TRADE_MODEL_OHLCV_INGESTION_SYMBOLS:}
      timeframes: ${TRADE_MODEL_OHLCV_INGESTION_TIMEFRAMES:5m,15m,1h,4h}
      bar-limit: ${TRADE_MODEL_OHLCV_INGESTION_BAR_LIMIT:100}
    watchlist:
      enabled: ${TRADE_MODEL_WATCHLIST_SCHEDULER_ENABLED:true}
  analysis:
    scheduler:
      enabled: ${TRADE_MODEL_ANALYSIS_SCHEDULER_ENABLED:false}
      initial-delay-ms: ${TRADE_MODEL_ANALYSIS_SCHEDULER_INITIAL_DELAY_MS:60000}
      fixed-delay-ms: ${TRADE_MODEL_ANALYSIS_SCHEDULER_FIXED_DELAY_MS:60000}
      symbols: ${TRADE_MODEL_ANALYSIS_SCHEDULER_SYMBOLS:BTCUSDT}
      timeframes: ${TRADE_MODEL_ANALYSIS_SCHEDULER_TIMEFRAMES:1m}
    idempotency:
      lease-seconds: ${TRADE_MODEL_ANALYSIS_IDEMPOTENCY_LEASE_SECONDS:120}
      max-recovery-attempts: ${TRADE_MODEL_ANALYSIS_IDEMPOTENCY_MAX_RECOVERY_ATTEMPTS:3}
  ohlcv:
    future-tolerance-ms: ${TRADE_MODEL_OHLCV_FUTURE_TOLERANCE_MS:30000}
    freshness-tolerance-ms: ${TRADE_MODEL_OHLCV_FRESHNESS_TOLERANCE_MS:30000}
    public-provider:
      enabled: ${TRADE_MODEL_PUBLIC_OHLCV_PROVIDER_ENABLED:false}
      external-calls-enabled: ${TRADE_MODEL_PUBLIC_OHLCV_EXTERNAL_CALLS_ENABLED:false}
  ai:
    enabled: ${TRADE_MODEL_AI_ENABLED:false}
    request-timeout-ms: ${TRADE_MODEL_AI_REQUEST_TIMEOUT_MS:5000}
    overall-timeout-ms: ${TRADE_MODEL_AI_OVERALL_TIMEOUT_MS:8000}
    max-input-chars: ${TRADE_MODEL_AI_MAX_INPUT_CHARS:24000}
    max-output-tokens: ${TRADE_MODEL_AI_MAX_OUTPUT_TOKENS:500}
    daily-budget-usd: ${TRADE_MODEL_AI_DAILY_BUDGET_USD:0}
    per-analysis-budget-usd: ${TRADE_MODEL_AI_PER_ANALYSIS_BUDGET_USD:0}
    openai:
      enabled: ${TRADE_MODEL_AI_OPENAI_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
      model: ${TRADE_MODEL_AI_OPENAI_MODEL:gpt-4.1-mini}
      base-url: ${TRADE_MODEL_AI_OPENAI_BASE_URL:https://api.openai.com}
      requests-per-minute: ${TRADE_MODEL_AI_OPENAI_RPM:0}
      input-cost-per-million-usd: ${TRADE_MODEL_AI_OPENAI_INPUT_COST_PER_MILLION_USD:0}
      output-cost-per-million-usd: ${TRADE_MODEL_AI_OPENAI_OUTPUT_COST_PER_MILLION_USD:0}
    gemini:
      enabled: ${TRADE_MODEL_AI_GEMINI_ENABLED:false}
      api-key: ${GEMINI_API_KEY:}
      model: ${TRADE_MODEL_AI_GEMINI_MODEL:gemini-1.5-flash}
      base-url: ${TRADE_MODEL_AI_GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
      requests-per-minute: ${TRADE_MODEL_AI_GEMINI_RPM:0}
      input-cost-per-million-usd: ${TRADE_MODEL_AI_GEMINI_INPUT_COST_PER_MILLION_USD:0}
      output-cost-per-million-usd: ${TRADE_MODEL_AI_GEMINI_OUTPUT_COST_PER_MILLION_USD:0}
    xai:
      enabled: ${TRADE_MODEL_AI_XAI_ENABLED:false}
      api-key: ${XAI_API_KEY:}
      model: ${TRADE_MODEL_AI_XAI_MODEL:grok-3-mini}
      base-url: ${TRADE_MODEL_AI_XAI_BASE_URL:https://api.x.ai}
      requests-per-minute: ${TRADE_MODEL_AI_XAI_RPM:0}
      input-cost-per-million-usd: ${TRADE_MODEL_AI_XAI_INPUT_COST_PER_MILLION_USD:0}
      output-cost-per-million-usd: ${TRADE_MODEL_AI_XAI_OUTPUT_COST_PER_MILLION_USD:0}
  external-context:
    news:
      api-key: ${NEWS_API_KEY:}
    macro-calendar:
      api-key: ${MACRO_CALENDAR_API_KEY:}
    etf-flow:
      api-key: ${ETF_FLOW_API_KEY:}
