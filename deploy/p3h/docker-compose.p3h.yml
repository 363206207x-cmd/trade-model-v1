name: ${P3H_COMPOSE_PROJECT_NAME:-trade-model-p3h}

services:
  postgres:
    image: postgres:16-alpine@sha256:fd1e8d0274f13f5a03a2673a207b28e14823c2f2efc3ca4bb4197c8a9f841bdc
    environment:
      POSTGRES_DB: trade_model_v1_p3h_primary
      POSTGRES_USER: p3h_bootstrap
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      TZ: UTC
    secrets:
      - postgres_admin_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U p3h_bootstrap -d trade_model_v1_p3h_primary"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - p3h_backend
    volumes:
      - p3h_postgresql:/var/lib/postgresql/data
      - p3h_backups:/var/lib/trade-model-p3h/backups
    restart: "no"
    logging: &bounded_logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  greenfield-preflight:
    image: postgres:16-alpine@sha256:fd1e8d0274f13f5a03a2673a207b28e14823c2f2efc3ca4bb4197c8a9f841bdc
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/p3h/postgres-greenfield-preflight.sh"]
    secrets:
      - postgres_admin_password
    volumes:
      - ./postgres-greenfield-preflight.sh:/p3h/postgres-greenfield-preflight.sh:ro
    networks:
      - p3h_backend
    restart: "no"
    logging: *bounded_logging

  role-bootstrap:
    image: postgres:16-alpine@sha256:fd1e8d0274f13f5a03a2673a207b28e14823c2f2efc3ca4bb4197c8a9f841bdc
    depends_on:
      greenfield-preflight:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/p3h/postgres-role-bootstrap-entrypoint.sh"]
    secrets:
      - postgres_admin_password
      - flyway_password
      - app_database_password_v1
      - app_database_password_v2
      - backup_reader_password
      - recovery_owner_password
    environment:
      P3H_ACTIVE_APP_DATABASE_SECRET_VERSION: ${P3H_ACTIVE_APP_DATABASE_SECRET_VERSION:?set V1 or V2}
    volumes:
      - ./postgres-role-bootstrap-entrypoint.sh:/p3h/postgres-role-bootstrap-entrypoint.sh:ro
      - ./postgres-role-bootstrap.sql:/p3h/postgres-role-bootstrap.sql:ro
    networks:
      - p3h_backend
    restart: "no"
    logging: *bounded_logging

  migrate:
    image: flyway/flyway:10-alpine@sha256:94a81ca7db9a9f24fd8acd7463fa4560cb8f66aae2aa64485c27eb296f5851cf
    depends_on:
      role-bootstrap:
        condition: service_completed_successfully
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/trade_model_v1_p3h_primary
      FLYWAY_USER: p3h_migration_owner
      FLYWAY_BASELINE_ON_MIGRATE: "false"
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_CONNECT_RETRIES: "30"
    secrets:
      - flyway_password
    entrypoint: ["/bin/sh", "/p3h/flyway-secret-entrypoint.sh"]
    volumes:
      - ../../src/main/resources/db/migration:/flyway/sql:ro
      - ./flyway-secret-entrypoint.sh:/p3h/flyway-secret-entrypoint.sh:ro
    networks:
      - p3h_backend
    restart: "no"
    logging: *bounded_logging

  readonly-grants:
    image: postgres:16-alpine@sha256:fd1e8d0274f13f5a03a2673a207b28e14823c2f2efc3ca4bb4197c8a9f841bdc
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "/p3h/postgres-readonly-grants-entrypoint.sh"]
    environment:
      P3H_READONLY_GRANTS_MODE: ${P3H_READONLY_GRANTS_MODE:-INITIALIZE}
    secrets:
      - postgres_admin_password
    volumes:
      - ./postgres-readonly-grants-entrypoint.sh:/p3h/postgres-readonly-grants-entrypoint.sh:ro
      - ./postgres-readonly-grants.sql:/p3h/postgres-readonly-grants.sql:ro
    networks:
      - p3h_backend
    restart: "no"
    logging: *bounded_logging

  flyway-validate:
    image: flyway/flyway:10-alpine@sha256:94a81ca7db9a9f24fd8acd7463fa4560cb8f66aae2aa64485c27eb296f5851cf
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/trade_model_v1_p3h_primary
      FLYWAY_USER: p3h_migration_owner
      FLYWAY_BASELINE_ON_MIGRATE: "false"
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_CONNECT_RETRIES: "30"
      P3H_FLYWAY_OPERATION: validate
    secrets:
      - flyway_password
    entrypoint: ["/bin/sh", "/p3h/flyway-secret-entrypoint.sh"]
    volumes:
      - ../../src/main/resources/db/migration:/flyway/sql:ro
      - ./flyway-secret-entrypoint.sh:/p3h/flyway-secret-entrypoint.sh:ro
    networks:
      - p3h_backend
    restart: "no"
    logging: *bounded_logging

  steady-state-verify:
    image: postgres:16-alpine@sha256:fd1e8d0274f13f5a03a2673a207b28e14823c2f2efc3ca4bb4197c8a9f841bdc
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/p3h/postgres-steady-state-verify.sh"]
    environment:
      P3H_STEADY_VERIFY_SCOPE: ${P3H_STEADY_VERIFY_SCOPE:-FULL_READONLY_STATE_VERIFY}
    secrets:
      - postgres_admin_password
    volumes:
      - ./postgres-steady-state-verify.sh:/p3h/postgres-steady-state-verify.sh:ro
      - ./postgres-versioned-contract-verify.sh:/p3h/postgres-versioned-contract-verify.sh:ro
      - ./postgres-rule-defaults-verify.sql:/p3h/postgres-rule-defaults-verify.sql:ro
      - ./postgres-schema-contract.sql:/p3h/postgres-schema-contract.sql:ro
    networks:
      - p3h_backend
    restart: "no"
    logging: *bounded_logging

  greenfield-recovery-verify:
    image: postgres:16-alpine@sha256:fd1e8d0274f13f5a03a2673a207b28e14823c2f2efc3ca4bb4197c8a9f841bdc
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/p3h/postgres-greenfield-recovery-verify.sh"]
    secrets:
      - postgres_admin_password
    volumes:
      - ./postgres-greenfield-recovery-verify.sh:/p3h/postgres-greenfield-recovery-verify.sh:ro
      - ./postgres-versioned-contract-verify.sh:/p3h/postgres-versioned-contract-verify.sh:ro
      - ./postgres-rule-defaults-verify.sql:/p3h/postgres-rule-defaults-verify.sql:ro
      - ./postgres-schema-contract.sql:/p3h/postgres-schema-contract.sql:ro
    networks:
      - p3h_backend
    restart: "no"
    logging: *bounded_logging

  app-database-secret-activate:
    image: postgres:16-alpine@sha256:fd1e8d0274f13f5a03a2673a207b28e14823c2f2efc3ca4bb4197c8a9f841bdc
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      P3H_ACTIVE_APP_DATABASE_SECRET_VERSION: ${P3H_ACTIVE_APP_DATABASE_SECRET_VERSION:?set V1 or V2}
      P3H_SECRET_VERSION_ACTIVATION_CONFIRM: ${P3H_SECRET_VERSION_ACTIVATION_CONFIRM:-}
    entrypoint: ["/bin/sh", "/p3h/p3h-app-database-secret-activate.sh"]
    secrets:
      - postgres_admin_password
      - app_database_password_v1
      - app_database_password_v2
    volumes:
      - ./p3h-app-database-secret-activate.sh:/p3h/p3h-app-database-secret-activate.sh:ro
    networks:
      - p3h_backend
    restart: "no"
    logging: *bounded_logging

  secret-volume-holder:
    image: postgres:16-alpine@sha256:fd1e8d0274f13f5a03a2673a207b28e14823c2f2efc3ca4bb4197c8a9f841bdc
    user: "65534:65534"
    entrypoint: ["/bin/sh", "-c", "exec tail -f /dev/null"]
    volumes:
      - type: volume
        source: p3h_materialized_secrets
        target: /materialized
        read_only: true
        volume:
          nocopy: true
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"
    logging: *bounded_logging

  secret-materializer:
    image: postgres:16-alpine@sha256:fd1e8d0274f13f5a03a2673a207b28e14823c2f2efc3ca4bb4197c8a9f841bdc
    user: "0:0"
    depends_on:
      readonly-grants:
        condition: service_completed_successfully
      secret-volume-holder:
        condition: service_started
    entrypoint: ["/bin/sh", "/p3h/p3h-secret-materializer.sh"]
    secrets:
      - app_database_password_v1
      - app_database_password_v2
      - app_admin_password_v1
      - app_admin_password_v2
      - binance_nonfunctional_key
      - binance_nonfunctional_secret
    environment:
      P3H_ACTIVE_APP_DATABASE_SECRET_VERSION: ${P3H_ACTIVE_APP_DATABASE_SECRET_VERSION:?set V1 or V2}
      P3H_ACTIVE_APP_ADMIN_SECRET_VERSION: ${P3H_ACTIVE_APP_ADMIN_SECRET_VERSION:?set V1 or V2}
    volumes:
      - ./p3h-secret-materializer.sh:/p3h/p3h-secret-materializer.sh:ro
      - type: volume
        source: p3h_materialized_secrets
        target: /materialized
        volume:
          nocopy: true
    networks:
      - p3h_backend
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    logging: *bounded_logging

  app:
    image: trade-model-v1:p3h-${P3H_APPLICATION_IMAGE_TAG:?set non-secret exact-head image tag}
    depends_on:
      postgres:
        condition: service_healthy
      readonly-grants:
        condition: service_completed_successfully
      secret-materializer:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/config/
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_SQL_INIT_MODE: never
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/trade_model_v1_p3h_primary
      SPRING_DATASOURCE_USERNAME: p3h_app_readonly
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_DATASOURCE_HIKARI_READ_ONLY: "true"
      SERVER_PORT: "8081"
      SERVER_ADDRESS: 0.0.0.0
      TRADE_MODEL_PRODUCTION_ALLOW_PUBLIC_BIND: "true"
      TRADE_MODEL_PRODUCTION_SCHEDULER_POLICY: LOCKED_DOWN
      TRADE_MODEL_PRODUCTION_SCHEDULER_APPROVAL_PUSH_RECHECK: PROD_ALLOWED_EXPLICIT_OPT_IN
      TRADE_MODEL_PRODUCTION_SCHEDULER_APPROVAL_POSITION_SYNC: PROD_ALLOWED_EXPLICIT_OPT_IN
      TRADE_MODEL_PRODUCTION_SCHEDULER_APPROVAL_MARKET_DATA: PROD_ALLOWED_EXPLICIT_OPT_IN
      TRADE_MODEL_PRODUCTION_SCHEDULER_APPROVAL_OHLCV_INGESTION: PROD_ALLOWED_EXPLICIT_OPT_IN
      TRADE_MODEL_PRODUCTION_SCHEDULER_APPROVAL_WATCHLIST: LOCAL_ONLY
      TRADE_MODEL_PRODUCTION_SCHEDULER_APPROVAL_POSITION_MONITOR: PROD_ALLOWED_DEFAULT_OFF
      TRADE_MODEL_PRODUCTION_SCHEDULER_APPROVAL_ANALYSIS: PROD_ALLOWED_EXPLICIT_OPT_IN
      TRADE_MODEL_PRODUCTION_SCHEDULER_APPROVAL_PROVIDER_SCAN: PROD_ALLOWED_DEFAULT_OFF
      TRADE_MODEL_SCHEDULERS_ENABLED: "false"
      TRADE_MODEL_PUSH_RECHECK_SCHEDULER_ENABLED: "false"
      TRADE_MODEL_POSITION_SYNC_SCHEDULER_ENABLED: "false"
      TRADE_MODEL_POSITION_MONITOR_SCHEDULER_ENABLED: "false"
      TRADE_MODEL_MARKET_DATA_SCHEDULER_ENABLED: "false"
      TRADE_MODEL_OHLCV_INGESTION_SCHEDULER_ENABLED: "false"
      TRADE_MODEL_WATCHLIST_SCHEDULER_ENABLED: "false"
      TRADE_MODEL_ANALYSIS_SCHEDULER_ENABLED: "false"
      TRADE_MODEL_PROVIDER_SCAN_SCHEDULER_ENABLED: "false"
      TRADE_MODEL_PROVIDER_CALL_ENABLED: "false"
      TRADE_MODEL_PROFILE_ESCALATION_ENABLED: "false"
      TRADE_MODEL_PROVIDER_AUTO_ESCALATION_ENABLED: "false"
      TRADE_MODEL_PROVIDER_EXTERNAL_CALLS_ENABLED: "false"
      TRADE_MODEL_PUBLIC_OHLCV_PROVIDER_ENABLED: "false"
      TRADE_MODEL_PUBLIC_OHLCV_EXTERNAL_CALLS_ENABLED: "false"
      TRADE_MODEL_COINGLASS_ENABLED: "false"
      TRADE_MODEL_COINGLASS_EXTERNAL_CALLS_ENABLED: "false"
      TRADE_MODEL_AI_ENABLED: "false"
      TRADE_MODEL_AI_OPENAI_ENABLED: "false"
      TRADE_MODEL_AI_GEMINI_ENABLED: "false"
      TRADE_MODEL_AI_XAI_ENABLED: "false"
      POSITION_PROVIDER_TYPE: BINANCE
      TRADE_MODEL_AUTH_ENABLED: "true"
      TRADE_MODEL_INITIAL_USERNAME: p3h_operator
      TRADE_MODEL_SESSION_COOKIE_SECURE: "true"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health
      TRADE_MODEL_SECURITY_RATE_LIMIT_ENABLED: "true"
      TRADE_MODEL_SECURITY_RATE_LIMIT_RPM: "120"
      TRADE_MODEL_SECURITY_RATE_LIMIT_WINDOW_MS: "60000"
    volumes:
      - type: volume
        source: p3h_materialized_secrets
        target: /run/secrets
        read_only: true
        volume:
          nocopy: true
    expose:
      - "8081"
    networks:
      - p3h_backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8081 &&
          printf 'GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: "no"
    logging: *bounded_logging

  proxy:
    image: nginx:1.27.4-alpine@sha256:4ff102c5d78d254a6f0da062b3cf39eaf07f01eec0927fd21e219d0af8bc0591
    depends_on:
      app:
        condition: service_healthy
    environment:
      P3H_STAGING_HOSTNAME: ${P3H_STAGING_HOSTNAME:?set approved staging hostname}
    secrets:
      - source: tls_certificate
        target: tls_certificate.pem
      - source: tls_private_key
        target: tls_private_key.pem
    volumes:
      - ./reverse-proxy.conf:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${P3H_HTTP_HOST_PORT:-80}:8080"
      - "${P3H_HTTPS_HOST_PORT:-443}:8443"
    networks:
      - p3h_edge
      - p3h_backend
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:rw,noexec,nosuid,size=1m
      - /var/cache/nginx:rw,noexec,nosuid,size=32m
      - /var/run:rw,noexec,nosuid,size=8m
      - /tmp:rw,noexec,nosuid,size=8m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - nginx -t >/dev/null 2>&1 && kill -0 1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: "no"
    logging: *bounded_logging

  app-role-probe:
    profiles: ["validation"]
    image: postgres:16-alpine@sha256:fd1e8d0274f13f5a03a2673a207b28e14823c2f2efc3ca4bb4197c8a9f841bdc
    depends_on:
      app:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/p3h/p3h-app-readonly-probe.sh"]
    secrets:
      - app_database_password_v1
      - app_database_password_v2
    environment:
      P3H_ACTIVE_APP_DATABASE_SECRET_VERSION: ${P3H_ACTIVE_APP_DATABASE_SECRET_VERSION:?set V1 or V2}
    volumes:
      - ./p3h-app-readonly-probe.sh:/p3h/p3h-app-readonly-probe.sh:ro
    networks:
      - p3h_backend
    restart: "no"
    logging: *bounded_logging

networks:
  p3h_edge: {}
  p3h_backend:
    internal: true

volumes:
  p3h_postgresql: {}
  p3h_backups: {}
  p3h_materialized_secrets:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=16m,mode=0700,nosuid,nodev,noexec

secrets:
  postgres_admin_password:
    file: ${P3H_SECRET_MOUNT_DIR:?set approved runtime secret mount}/postgres_admin_password
  flyway_password:
    file: ${P3H_SECRET_MOUNT_DIR:?set approved runtime secret mount}/flyway_password
  app_database_password_v1:
    file: ${P3H_SECRET_MOUNT_DIR:?set approved runtime secret mount}/app_database_password_v1
  app_database_password_v2:
    file: ${P3H_SECRET_MOUNT_DIR:?set approved runtime secret mount}/app_database_password_v2
  app_admin_password_v1:
    file: ${P3H_SECRET_MOUNT_DIR:?set approved runtime secret mount}/app_admin_password_v1
  app_admin_password_v2:
    file: ${P3H_SECRET_MOUNT_DIR:?set approved runtime secret mount}/app_admin_password_v2
  backup_reader_password:
    file: ${P3H_SECRET_MOUNT_DIR:?set approved runtime secret mount}/backup_reader_password
  recovery_owner_password:
    file: ${P3H_SECRET_MOUNT_DIR:?set approved runtime secret mount}/recovery_owner_password
  binance_nonfunctional_key:
    file: ${P3H_SECRET_MOUNT_DIR:?set approved runtime secret mount}/binance_nonfunctional_key
  binance_nonfunctional_secret:
    file: ${P3H_SECRET_MOUNT_DIR:?set approved runtime secret mount}/binance_nonfunctional_secret
  tls_certificate:
    file: ${P3H_SECRET_MOUNT_DIR:?set approved runtime secret mount}/tls_certificate
  tls_private_key:
    file: ${P3H_SECRET_MOUNT_DIR:?set approved runtime secret mount}/tls_private_key
