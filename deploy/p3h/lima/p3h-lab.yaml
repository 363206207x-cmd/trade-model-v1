minimumLimaVersion: 2.0.0

base:
  - template:debian-12

cpus: 4
memory: 8GiB
disk: 40GiB

# The lab receives one exact git archive over pinned SSH. Host directories,
# including the repository and local runtime/secret locations, are not mounted.
mounts: []

containerd:
  system: false
  user: false

# This template intentionally starts only the minimal Linux VM. Package and
# Docker provisioning is a separate, sanitized, 30-minute bounded stage.
provision: []

probes:
  - script: |
      #!/usr/bin/env bash
      set -euo pipefail
      systemctl is-system-running --wait >/dev/null 2>&1 || true
      test "$(uname -s)" = Linux
      systemd-creds --help >/dev/null
    hint: Minimal Linux/systemd startup failed before controlled guest provisioning.
