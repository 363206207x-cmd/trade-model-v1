limit_req_zone $binary_remote_addr zone=p3h_api:10m rate=20r/s;
limit_req_status 429;

map $remote_addr $p3h_client_class {
    default external;
    ~^10\. private;
    ~^192\.168\. private;
    ~^172\.(1[6-9]|2[0-9]|3[0-1])\. private;
    127.0.0.1 loopback;
}

log_format p3h_safe '$time_iso8601 status=$status method=$request_method '
                     'path=$uri client=$p3h_client_class request_id=$request_id';

server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;
    access_log /dev/stdout p3h_safe;
    return 444;
}

server {
    listen 8080;
    server_name ${P3H_STAGING_HOSTNAME};
    server_tokens off;
    access_log /dev/stdout p3h_safe;
    error_log /dev/stderr warn;
    return 308 https://${P3H_STAGING_HOSTNAME}$request_uri;
}

server {
    listen 8443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 8443 ssl;
    server_name ${P3H_STAGING_HOSTNAME};
    server_tokens off;

    ssl_certificate /run/secrets/tls_certificate.pem;
    ssl_certificate_key /run/secrets/tls_private_key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 1m;
    access_log /dev/stdout p3h_safe;
    error_log /dev/stderr warn;

    location ~ ^/actuator/health(?:/.*)?$ {
        proxy_pass http://app:8081;
        proxy_http_version 1.1;
        proxy_set_header Host ${P3H_STAGING_HOSTNAME};
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    location ~ ^/(?:login|logout|favicon\.ico|(?:css|js|images|webjars)/.*)$ {
        limit_req zone=p3h_api burst=20 nodelay;
        proxy_pass http://app:8081;
        proxy_http_version 1.1;
        proxy_set_header Host ${P3H_STAGING_HOSTNAME};
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Cookie $http_cookie;
        proxy_hide_header X-Powered-By;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    location ~ ^/(?:api/|dashboard(?:/|$)|review(?:/|$)) {
        limit_req zone=p3h_api burst=20 nodelay;
        proxy_pass http://app:8081;
        proxy_http_version 1.1;
        proxy_set_header Host ${P3H_STAGING_HOSTNAME};
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_hide_header X-Powered-By;
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    location / {
        return 404;
    }
}
