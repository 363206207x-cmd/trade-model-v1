services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  migrate:
    image: flyway/flyway:10-alpine
    profiles: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      FLYWAY_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      FLYWAY_CONNECT_RETRIES: 60
    command: migrate
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql:ro
    restart: "no"

  app:
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: 8081
      SERVER_ADDRESS: ${SERVER_ADDRESS:-0.0.0.0}
      TRADE_MODEL_PRODUCTION_ALLOW_PUBLIC_BIND: ${TRADE_MODEL_PRODUCTION_ALLOW_PUBLIC_BIND:-true}
      PROD_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      PROD_DATASOURCE_USERNAME: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      PROD_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSITION_PROVIDER_TYPE: ${POSITION_PROVIDER_TYPE:-BINANCE}
      BINANCE_API_BASE_URL: ${BINANCE_API_BASE_URL:-https://fapi.binance.com}
      BINANCE_API_KEY: ${BINANCE_API_KEY:?set BINANCE_API_KEY in .env}
      BINANCE_API_SECRET: ${BINANCE_API_SECRET:?set BINANCE_API_SECRET in .env}
      TRADE_MODEL_AI_ENABLED: ${TRADE_MODEL_AI_ENABLED:-false}
      TRADE_MODEL_AI_OPENAI_ENABLED: ${TRADE_MODEL_AI_OPENAI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      TRADE_MODEL_AI_GEMINI_ENABLED: ${TRADE_MODEL_AI_GEMINI_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TRADE_MODEL_AI_XAI_ENABLED: ${TRADE_MODEL_AI_XAI_ENABLED:-false}
      XAI_API_KEY: ${XAI_API_KEY:-}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8081}:8081"
    restart: unless-stopped

volumes:
  postgres_data:
