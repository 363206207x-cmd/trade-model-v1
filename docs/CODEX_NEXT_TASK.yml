  Reuse the frozen Asset Pool-to-Review chain. State-sensitive opportunity scans are observing 15m, candidate 5m, waiting_trigger 2m and triggered lightweight 1m; active real positions are monitored every 30s. Full Analysis and Three AI remain promotion/checkpoint-gated. Opportunity state, Plan Mode, Final and UserPosition remain separate.

design_interaction_mapping: |
  No page, component, route, overlay, Figma, Desktop or Mobile interaction changes are included. Existing truthful fail-closed states remain the only user-visible projection.

data_source_mapping: |
  Reuse AssetPool/PoolItem, Opportunity/StateLog, AnalysisRun, Evidence/Score/Decision, Candidate/Resolver/Validation/Final, UserPosition, PositionMonitorLog, Review, Message and ChannelDelivery. Binance public SPOT closed 5m/15m/1h/4h OHLCV is source-owned and never mixed or silently replaced. Missing facts fail closed.

