  The existing fourteen routes, eleven overlays, Home six-card and 70/30 structure remain authoritative. The successor may repair only reproducible interaction, state, form, accessibility and responsive defects on the exact Home/Workspace surfaces after the audit list is frozen; it may not redesign Figma or expand route scope.

