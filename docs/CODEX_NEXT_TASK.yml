compatibility_status: "DERIVED_ONLY"
active_block: "PDR-M6A Real Server Acceptance Evidence Gate"
current_phase: "P0-0"
current_phase_status: "DONE"
completion_effective_state: "DERIVED_BY_V1_STATE"
existing_module_maturity: "PARTIAL"
module: "PDR-M6A Real Server Acceptance Evidence Gate"
branch: "codex/pdr-m6a-real-server-evidence-gate"
risk: "B-risk production readiness evidence framework"
current_pr: "none"
next_business_phase: "Post-freeze user acceptance / production readiness remediation"
next_business_phase_allowed: false
next_allowed_action: "Autodeliver this PDR-M6A evidence gate framework after review. Production Deployment Readiness remains BLOCKED. Next action is user-run real server acceptance evidence collection; do not mark CONDITIONALLY_READY until completed redacted evidence is supplied and explicitly approved."
current_package_pr: "none"
unrelated_open_prs: "DERIVED_BY_V1_STATE"
block_next_business_phase_only: false
a_risk_auto_merge_rule: "enabled for docs / contract / workflow packages only"

allowed_scope:
  - "Add the real-server production acceptance evidence template"
  - "Add a conservative prod-release-gate script that orchestrates only safe checks"
  - "Document exact server commands and required redacted evidence outputs"
  - "Document Docker Compose, PostgreSQL, Flyway, app prod startup, authenticated smoke, backup, restore, HTTPS/reverse proxy, provider readiness, and safety-boundary evidence requirements"
  - "Add release-gate env placeholders without real secrets"
  - "Update production readiness runbook and status docs"
  - "Preserve Production Deployment Readiness as BLOCKED"
  - "Preserve no production-ready, conditionally-ready, order/execution, Push send, Push Recheck execution, external channel, Telegram send, sensitive actuator exposure, or auto-trading claim"

forbidden_scope:
  - "Java backend code"
  - "sensitive actuator endpoints such as env, configprops, beans, mappings, loggers, heapdump, threaddump, or metrics"
  - "Prometheus/Grafana/alerting stack unless explicitly authorized"
  - "schema.sql"
  - "Flyway migration SQL"
  - "mapper SQL"
  - "business API contracts or routes"
  - "tests"
  - "unrelated scripts"
  - "dashboard.html"
  - "review.html"
  - "application-prod.yml"
  - "default Spring Boot Flyway auto-migration for local/H2 tests"
  - "live PostgreSQL connection"
  - "real server deployment"
  - "real secrets"
  - "real production database connection from Codex"
  - "restore execution against a real DB by Codex"
  - "secrets manager implementation"
  - "HTTPS/reverse-proxy implementation"
  - "scheduler"
  - "trading/execution/order logic"
  - "Push send"
  - "Telegram send"
  - "external channel"
  - "order / execution / auto-trading"
  - "UserPosition creation / mutation"
  - "AI direction override"
  - "state-machine override"

checks:
  - "git status --short"
  - "./mvnw test -q"
  - "bash scripts/v1-delivery-check.sh"
  - "bash scripts/v1-state.sh"
  - "git diff --check"
  - "bash -n scripts/prod-smoke.sh"
  - "bash -n scripts/prod-backup.sh"
  - "bash -n scripts/prod-restore.sh"
  - "bash -n scripts/prod-release-gate.sh"
  - "docker compose --env-file .env.example config if Docker Compose is available"

stop_conditions:
  - "claiming Production Deployment Readiness is unblocked"
  - "production-ready claim"
  - "forbidden business surface change"
  - "requires real secrets"
  - "requires real server access"
  - "requires executing restore against a real DB"
  - "requires changing Java business logic outside security/config guards"
  - "requires changing schema.sql"
  - "requires changing mapper SQL or Flyway migration SQL"
  - "requires reporting CONNECTED from config-only provider fields"
  - "requires live external API calls in default tests or smoke"
  - "requires exposing sensitive actuator endpoints"
  - "requires weakening auth protection"
  - "requires HTTPS/reverse-proxy or secrets manager implementation"
  - "requires real external API calls"
  - "requires Telegram send or Push dispatch"
  - "requires order/execution/auto-trading semantics"
  - "would mark production readiness READY"
  - "would mark CONDITIONALLY_READY without real evidence"
  - "Maven failure"
  - "v1-state blockers"
