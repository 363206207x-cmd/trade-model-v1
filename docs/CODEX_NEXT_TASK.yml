product_contract_mapping: |
  This package authorizes one bounded closure over the existing Spring Security boundary, Cloudflare Tunnel, Analysis scheduler and Home status strip. It may persist the unchanged 30-minute Session in PostgreSQL, expose real scheduler and AnalysisRun evidence through the existing Home field, bind trinelogic.com, redirect www and retire the legacy public Funnel. It creates no trading capability and changes no product algorithm.

design_interaction_mapping: |
  No Figma, Mobile, route, component or layout change is authorized. The only user-visible change is the value and safe timestamp rendered inside the existing Home system-status slot.

data_source_mapping: |
  This docs/gate package reads or changes no provider, database, runtime or user data. The successor may add Spring Session infrastructure tables, derive runtime status from the real scheduler heartbeat and persisted AnalysisRun owner, and change only official ingress configuration. It may not call paid AI, send Telegram, mutate business data or execute trades.

current_implementation_gap: |
  The official root currently resolves through the existing Cloudflare Tunnel but is intercepted by a second Cloudflare Access login, www is absent, servlet Sessions are in process memory, and the Home system slot incorrectly reads an unrelated risk card. The scheduler really runs, but its heartbeat, scan times, result and failure state are not projected.

