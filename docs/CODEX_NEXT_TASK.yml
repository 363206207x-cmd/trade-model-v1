  - "Review backend URL fail-closed rules: no default host, no loopback/credentials, private-LAN HTTP only in development, and HTTPS-only production"
  - "Review trusted navigation, default TLS handling, ATS local-network scope, and absence of credential/Cookie/CSRF native handling"
  - "Review XCTest, UI test, Xcode project/signing hygiene, Simulator build/install/launch evidence, and Java regression"
  - "Keep real iPhone, real server, App Store/TestFlight/Ad Hoc, P4, and production readiness explicitly unproven"
forbidden_scope:
