product_contract_mapping: |
  Frozen Section 15.2 retains all three in-app Message categories. The Owner first release narrows Telegram Delivery to CONFIRMATION Final alerts and trusted material active-position alerts only; safety-change Messages remain in-app and the frozen capability ceiling is unchanged.

design_interaction_mapping: |
  No page, component, route, overlay, Figma or Mobile interaction changes are included. The successor may only alter existing Telegram short-alert content and delivery qualification; current application navigation remains unchanged.

data_source_mapping: |
  Reuse persisted Message and ChannelDelivery facts. Opportunity alerts read a validated CONFIRMATION FinalExecutionPlan and real required plan fields, with PushSnapshot optional. Position alerts read OPEN/PARTIALLY_CLOSED UserPosition plus VERIFIED/FRESH PositionMonitor facts. Missing or untrusted facts fail closed.

current_implementation_gap: |
  Merged main recognizes the historical Telegram implementation as COMPLETE but machine state does not recognize a new Owner-narrowed remediation authorization. Current delivery policy can still include the frozen third Telegram category or broader opportunity eligibility and therefore needs a separately authorized bounded remediation.

