  Telegram success is Telegram API success plus configured bot/recipient identity agreement and a durable provider message ID on ChannelDelivery. Home cards, plans and AI content must resolve from consistent AnalysisRun/Decision/Trace owners. Manual position fields remain Owner-scoped UserPosition facts and tests use isolated databases rather than fake Staging records.

