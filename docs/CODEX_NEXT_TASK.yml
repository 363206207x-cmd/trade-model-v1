product_contract_mapping: |
  Asset Pool is the only opportunity source. The frozen chain is Asset Pool through Opportunity, Analysis, Evidence, Score, Decision, GPT Candidate, Gemini Review, Grok Challenge, Conflict Resolver, Rule Validation, FinalExecutionPlan, explicit manual UserPosition, Position Monitoring, and Review. Opportunity state remains separate from execution permission and UserPosition.

design_interaction_mapping: |
  Figma and Mobile do not change. This package authorizes backend capability only. ExecutionPlan remains a system decision artifact; only an authenticated explicit manual action creates UserPosition. No generated output may imply automatic trading.

data_source_mapping: |
  Reuse the existing watchlist/asset source, AssetState and OpportunityLog, AnalysisRun, EvidenceItem, ScoreItem, DecisionBundle/DecisionResult, ExecutionPlan, AiCallLog, conflict resolver, UserPosition, PositionMonitorLog, and Review owners. Introduce one canonical persisted ExecutionPlanCandidate boundary only after reconciling existing candidate assets. All critical writes carry traceId and exact analysis/opportunity/candidate/final links.

current_implementation_gap: |
  Product design is frozen but the repository does not yet prove one production chain with Asset Pool-only sourcing, unified opportunity transitions, strict three-role authority, persisted Candidate/Final separation, complete conflict/rule validation, complete AI trace, and end-to-end review linkage. Existing partial and review-only skeletons require reconciliation rather than duplication.

allowed_scope:
  - "Create and register the v4.1 Product Source, authorization, ownership, and validation records"
  - "Update Delivery Matrix, Product Roadmap, Product Source, Current State, contract log, and task declaration"
  - "Add the minimal exact-package runtime transition and deterministic authorization tests"
  - "Verify no application/API/schema/Mobile/Figma/business-test diff enters this authorization package"

authorized_next_allowed_scope:
  - "Complete Asset Pool search/add/remove/restore/scan and enforce it as the sole opportunity source"
  - "Complete the eight-state Opportunity state machine, one transition entry point, audit, debounce, cooling, and precedence"
  - "Reuse and connect AnalysisRun, EvidenceItem, ScoreItem, DecisionBundle, UserPosition, PositionMonitorLog, and Review"
  - "Implement GPT Candidate generation, Gemini Candidate review, Grok risk challenge, Conflict Resolver, Rule Validation, and Final plan"
  - "Persist separate Candidate and Final identities with complete analysis, trace, reason, fallback, and review linkage"
  - "Make only schema and API changes required by the frozen backend chain and add its complete tests"

authorized_next_blocked_scope:
  - "Automatic open, close, partial close, reduce, add, reverse, order, or any executable trading behavior"
  - "AI state mutation, AI rule bypass, Candidate exposed as Final, or Final plan converted to UserPosition"
  - "Opportunity generation outside Asset Pool or a fixed BTC/ETH/SOL-only source"
  - "Duplicate Analysis, Evidence, Score, Decision, Plan, Position, Monitor, Review, AI trace, resolver, pool, or state stack"
  - "Mobile, Figma, frontend redesign, unrelated notification/external delivery, or next-stage expansion"

blocked_scope:
