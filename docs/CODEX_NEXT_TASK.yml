compatibility_status: "DERIVED_ONLY"
active_block: "P0-0 Contract Delivery Package and Merge"
current_phase: "P0-0"
current_phase_status: "DONE"
completion_effective_state: "DERIVED_BY_V1_STATE"
existing_module_maturity: "PARTIAL"
module: "Contract Lock + Baseline + Dead Code Candidate Report"
branch: "p0-0-global-audit-contract-reconciliation"
risk: "A"
next_business_phase: "P0-1 UserPosition"
next_business_phase_allowed: false
next_allowed_action: "Separately authorized stage / commit / push / A-risk PR creation for the P0-0 contract delivery package. P0-1 remains blocked until that PR is merged, main is synced, and the worktree is clean."

allowed_scope:
  - "P0-0 contract/status/matrix/audit files"
  - "compatibility fact files"
  - "workflow scripts/docs"
  - "checks and closure evidence"
  - "separately authorized package/merge commands in a later task"

forbidden_scope:
  - "Java"
  - "tests"
  - "schema"
  - "config"
  - "pom"
  - "Dashboard"
  - "UserPosition implementation"
  - "ExecutionPlan Source Gate implementation"
  - "AccountRisk implementation"
  - "PositionMonitor implementation"
  - "Review implementation"
  - "PushRecheck implementation"
  - "HotReset implementation"
  - "AI orchestration"
  - "production deployment"
  - "stage/commit/push unless a later task explicitly authorizes"

checks:
  - "./mvnw test -q"
  - "bash -n scripts/check-workflow-contract.sh"
  - "bash -n scripts/v1-state.sh"
  - "bash -n scripts/v1-auto.sh"
  - "bash -n scripts/codex-next-task.sh"
  - "bash scripts/check-workflow-contract.sh"
  - "bash scripts/codex-next-task.sh --validate"
  - "bash scripts/v1-state.sh"
  - "bash scripts/v1-auto.sh status"
  - "bash scripts/v1-auto.sh summary"
  - "git diff --check"
  - "git diff --cached --quiet"

stop_conditions:
  - "White-list violation"
  - "HEAD changes"
  - "staged files"
  - "P0-1 task generation"
  - "business file change"
  - "workflow contract failure"
  - "Maven failure"
