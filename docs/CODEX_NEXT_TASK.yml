  - PS-V1-ARCHITECTURE
  - PS-POSITION-MONITORING
  - PS-AI-CONFLICT-RECHECK-REVIEW
  - PS-HOME-INTERACTION
  - PS-FIGMA-BASELINE
  - PS-FORMAL-BUSINESS-CONTRACT

product_contract_mapping: |
  Register the formal V1 architecture, Position Monitoring, AI Conflict/Confused/Push Recheck/Review, final Home interaction, frozen Figma, and business delivery sources. Freeze rule-first decision authority; separate AssetState, ExecutionPlan, UserPosition, PositionMonitor, Push Recheck, and Message domains; preserve no automatic trading and exact owner/public privacy boundaries.

design_interaction_mapping: |
  Freeze the five primary tabs, Home module order, context-only focus-asset click, linked ExecutionPlan and exactly three AI summaries, Top3 positions, explicit detail links, and distinct Loading/Empty/Error/Partial/Missing behavior. This P0 task documents those interactions and does not edit UI or Figma.

data_source_mapping: |
  Map product fields to source domain, current/designated Service and API, provider/database, cadence, snapshot/cache behavior, null/error behavior, exact identity, owner scope, and public/private classification. Unknown or unproven fields remain product gaps and cannot be marked complete.

current_implementation_gap: |
  The repository has substantial backend and responsive-web foundations but lacked one immutable product authority, permanent source-first startup, complete field/interaction/state baselines, product-evidence completion scoring, and a Product First roadmap. Home, live position monitoring, real three-AI evidence, Message UI, iPhone, server, and production scenarios remain incomplete.

allowed_scope:
  - "Register and snapshot the located formal product sources with hashes"
  - "Create the Product Source of Truth and ten P0 product baseline documents"
  - "Update permanent agent, bootstrap, task, answer, workflow, and state documentation"
  - "Add one minimal deterministic product-source-gate shell script"
  - "Invoke the product gate at the start of the existing workflow-contract check"
  - "Run three read-only gate simulations and required validation"
  - "Commit, push, and create a Draft P0 PR only"

blocked_scope:
  - "Java business code, business API, database schema, HTML, CSS, JavaScript, business tests, or Figma"
  - "Home, Position, AI, Message, My, Detail, Server, iPhone, notification, or trading implementation"
  - "Natural-language governance parser, synonym inventory, semantic digest, or self-governing gate expansion"
  - "Any edit, metadata transition, thread resolution, Ready transition, or merge of PR #1156"
  - "Ready transition or merge of the P0 Draft PR"
  - "P1 implementation before P0 is independently reviewed and merged to main"

# Legacy compatibility alias; it cannot override blocked_scope.
forbidden_scope:
  - "Business code/API/schema/UI/Figma/test changes"
  - "Automatic trading or position mutation"
  - "PR #1156 modification or thread resolution"
  - "P1 implementation"

real_scenario_requirement: |
  P0 has no business execution scenario. It must deterministically simulate Home Asset Card, Position Monitor Risk Prompt, and Three-AI Analysis task mappings, proving the required sources, meanings, fail-closed behavior, and hard boundaries without editing business code.

hard_boundaries:
  auto_trading: "BLOCKED"
  automatic_position_mutation: "BLOCKED"
  push_recheck_trading_authorization: "BLOCKED"
  fake_data_as_real: "BLOCKED"
  owner_scope_bypass: "BLOCKED"

checks:
  - "Product source paths exist, are non-empty, and match registered SHA-256 hashes"
  - "Product Source Gate and all three simulations pass"
  - "Workflow contract, Markdown/YAML, links/paths, diff checks, and Maven pass"
  - "Changed scope contains no Java, business API, schema, UI, Figma, business test, notification, or trading files"
  - "PR #1156 Head, Draft/open/unmerged state, and unresolved-thread count remain unchanged"
  - "The P0 PR remains Draft and unmerged"

stop_conditions:
  - "A required formal product source is missing, empty, hash-mismatched, or in unresolved conflict"
  - "Repository identity, branch base, paused stash/patch, or PR #1156 preservation cannot be verified"
  - "Product/design/data/gap/task mappings are absent or the Product Source Gate is blocked"
  - "The change would touch Java, business API, schema, UI, Figma, business tests, notification, or trading"
  - "The task would present fake data as real, weaken owner scope/privacy/fail-closed behavior, or infer exact identity from symbol/latest"
  - "The gate starts expanding into a semantic parser, inventory, digest, or independent governance roadmap"
  - "P1 implementation, P0 Ready transition, or merge would begin in this task"

