  - "real Provider, AI, Binance private API, Telegram, Push, webhook, email, or other external calls"
  - "business scheduler activation"
  - "production server or production database access"
  - "real secret read, committed secret, committed .env, or secret output"
  - "destructive database operation"
  - "order execution, auto-open, auto-close, auto-reverse, auto-trading, or position mutation"
  - "P4"
  - "production-ready claim"
