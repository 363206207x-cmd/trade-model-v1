product_contract_mapping: |
  This package authorizes one bounded runtime closure over existing Binance, CoinGlass, Evidence, AI readiness and Three-AI owners. It may correct Provider-to-Evidence freshness semantics, make exact-model readiness recover through the existing scheduler, enforce time-bounded CoinGlass health and prove one real guarded Three-AI chain. It creates no second business object and does not change scoring, direction, Plan Mode, Final ownership or no-trade boundaries.

design_interaction_mapping: |
  No Figma, Desktop, Mobile, route, component, layout, content or interaction change is included or authorized.

data_source_mapping: |
  This docs/gate package reads or changes no provider, database, runtime or user data. The successor may use existing read-only Binance, CoinGlass and AI configuration only for private Staging regression; it may not send Telegram or execute trades.

current_implementation_gap: |
  Real Binance data and CoinGlass-derived evidence exist on private Staging, but CoinGlass STALE_READABLE is passed into the frozen Evidence contract without semantic translation, exact-model readiness is not naturally reverified after restart, and CoinGlass health has no current-time bound. These gaps keep valid real runs outside the AI input gate and prevent truthful 5/5 readiness.

