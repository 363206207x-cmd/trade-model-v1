product_contract_mapping: |
  Preserve manual owner-scoped UserPosition as the only actual-position source. Keep original entry-logic status, monitor conclusion, reversal status, risk-change reason, per-position risk, manual suggested action, and source trust as independent meanings. PositionMonitor may advise but may never open, close, reduce, add, reverse, or order.

design_interaction_mapping: |
  The frozen Position Monitoring UI and Mobile/Figma are unchanged. Backend output must support truthful No Position, Open Monitoring, Waiting Monitor Data, Risk Escalated, Plan Invalidated, and Closed-removal behavior without fabricating values or mixing ExecutionPlan with UserPosition.

data_source_mapping: |
  UserPosition supplies exact owner-scoped position facts. Verified and fresh PositionMonitorLog plus a traceable market observation supplies mark price, PnL eligibility, per-position risk, conclusion, reversal, reason, suggested manual action, and last monitor time. Missing, stale, pending, or invalid sources return explicit unavailable state and nullable values, never zero/default success.

current_implementation_gap: |
  Product P1B is complete, but Product P2 remains unimplemented. The current backend has incomplete independent monitor semantics, per-position risk, source trust/freshness, mark-price provenance, nullable PnL, and Dashboard Home Position contract support. A separate dirty candidate worktree exists but is not authoritative or effective before this authorization is merged.

