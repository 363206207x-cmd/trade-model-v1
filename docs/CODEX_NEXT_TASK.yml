allowed_scope:
  - "Add an authoritative string messageId and preserve pushId as a string-safe identity across JSON and JavaScript boundaries"
  - "Add exact sourceIdentity for only real opportunity and UserPosition monitoring-risk messages; symbol, latest, time, index, and frontend-generated identity are forbidden"
  - "Create the minimal real UserPosition -> PositionMonitor -> risk-event -> message foundation without automatic monitor execution or fabricated events"
  - "Apply authenticated owner scope to message list/detail and Push Detail reads so one user cannot access another user's message, position risk, or Push context"
  - "Add a read-only GET contract by exact messageId that returns the linked original snapshot, current persisted Recheck state, and returned change reason without invoking Recheck or any mutation"
  - "Distinguish Empty, Error, Missing, and Partial states; Error must never be represented as an empty successful list"
  - "Add focused DTO precision, owner isolation, source identity, Push Detail GET, state separation, and contract tests"
forbidden_scope:
  - "FE-04E Message Center or Push Detail templates, CSS, JavaScript, frontend tests, navigation activation, or fabricated UI data"
  - "Telegram Bot, external send, automatic notification, delivery acknowledgement, retry/dispatch execution, scheduler, webhook, or provider integration"
  - "Frontend-triggered Push Recheck POST, monitor run, replay, manual close, partial close, or any mutation"
  - "Ordinary system notices mixed into the two product sources, AI-generated messages, symbol-only identity, latest/time/index fallback, or frontend-generated message identity"
  - "Unrelated Controller, Service, Mapper, Entity, DTO, API, schema, authentication, Session, or backend business-rule expansion"
  - "Figma modification, node creation, node deletion, component change, or prototype change"
  - "Fabricated message, Push detail, source record, position risk, timestamp, current state, change reason, read state, or delivery state"
  - "FE-04F Profile, P4, production deployment, automatic open/close/reverse, order execution, trading controls, or PushRecheck represented as trading authorization"
checks:
  - "FE-04A through FE-04D merged-main evidence remains unchanged and overall FE-04 remains IN_PROGRESS/PARTIAL"
  - "Every message and Push Detail read uses exact string-safe identity and authenticated owner scope"
  - "Opportunity and position-risk messages are backed by real persisted source records; no source is inferred from symbol or time"
  - "Push Detail GET composes only persisted original snapshot, latest persisted Recheck state, and returned reasons without invoking a write endpoint"
  - "Empty, Error, Missing, and Partial are separately tested and no exception is silently presented as an empty success"
  - "No frontend, Figma, Telegram, external-send, automatic-notification, AI, or trading capability movement occurs"
  - "Run focused contract/security tests, full Maven, Workflow Contract, git diff --check, and v1-state"
stop_conditions:
  - "This readiness governance alignment is not merged to clean, synced main before Contract Foundation implementation starts"
  - "A message or Push read would require symbol/latest/time/index fallback, frontend-generated identity, or cross-owner access"
  - "A real opportunity/UserPosition-risk source cannot be persisted or linked without expanding into notification delivery behavior"
  - "Push Detail would need to trigger Recheck POST, monitor run, replay, dispatch, or another mutation"
  - "Missing source, snapshot, current state, reason, timestamp, or read status would need fabrication"
  - "The package would implement FE-04E UI, Telegram, external send, FE-04F, AI expansion, trading, or mark overall FE-04 DONE"
