product_contract_mapping: |
  The successor closes durable delivery for all three frozen Message categories without creating a second message owner, then audits every existing official-domain interaction before one consolidated remediation. Candidate, Final, UserPosition, PositionMonitor and Recheck identities stay separate; no UI state, notification or AI result authorizes a trade.

design_interaction_mapping: |
  The existing fourteen routes, eleven overlays, Home six-card and 70/30 structure remain authoritative. The successor may repair only reproducible interaction, state, form, accessibility and responsive defects on the exact Home/Workspace surfaces after the audit list is frozen; it may not redesign Figma or expand route scope.

data_source_mapping: |
  Telegram success is Telegram API success plus configured bot/recipient identity agreement and a durable provider message ID on ChannelDelivery. Home cards, plans and AI content must resolve from consistent AnalysisRun/Decision/Trace owners. Manual position fields remain Owner-scoped UserPosition facts and tests use isolated databases rather than fake Staging records.

current_implementation_gap: |
  Safety-change Messages can remain permanently orphaned because listTelegramDeliveryOrphans omits the canonical safety category. A previous provider-level controlled send reported success without Owner receipt, so channel identity and durable receipt remain unaccepted. Position form date/time interaction and value preservation plus all route controls still require one complete real-browser audit.

