real_scenario_requirement: |
  This authorization package executes no business scenario. It must prove that the exact implementation request is blocked before merge, allowed only after clean/synced merged-main effectivity, and that wrong-package requests fail closed. End-to-end real scenarios remain mandatory for the implementation capability audit.

