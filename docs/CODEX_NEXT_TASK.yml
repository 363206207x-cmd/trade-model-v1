product_contract_mapping: |
  This package authorizes one bounded access closure over the existing Spring Security Session boundary and Tailscale staging ingress. It may add the missing explicit Referrer-Policy, activate the existing Funnel to the loopback-only application port, and validate anonymous denial plus authenticated Home access. It creates no product capability and does not change any business owner or no-trade boundary.

design_interaction_mapping: |
  No Figma, Desktop, Mobile, route, component, layout, content or interaction change is included or authorized.

data_source_mapping: |
  This docs/gate package reads or changes no provider, database, runtime or user data. The successor may inspect existing Staging authentication and health surfaces only; it may not call paid AI, send Telegram, mutate business data or execute trades.

current_implementation_gap: |
  The application is healthy on loopback and privately reachable through Tailscale Serve, with Secure/HttpOnly/SameSite cookies, CSRF, bounded login failures, HSTS, frame denial and MIME-sniffing protection. Cross-device access is blocked because Funnel is off, and runtime header evidence shows the otherwise complete HTTPS boundary lacks an explicit Referrer-Policy.

