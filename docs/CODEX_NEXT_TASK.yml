product_contract_mapping: |
  Preserve seven primary Asset Card fields and allow dataQuality, multiTimeframeState, Confused, and updatedAt only in a subordinate status strip. ExecutionPlan requires exact persisted identity; Top3 remains owner-scoped UserPosition and independent of selectedSymbol; Home states fail closed. No part creates a trade, notification, or position mutation.

design_interaction_mapping: |
  Preserve the five primary tabs, frozen Home order, context-only Asset Card click, seven-field primary visual hierarchy, lower-emphasis secondary status strip, independent Top3 positions, and distinct LOADING/READY/PARTIAL/EMPTY/ERROR/MISSING behavior. This authorization task does not edit UI or Figma.

data_source_mapping: |
  Require persisted market/OHLCV for price, valid decision data for direction/score/confidence, asset-only risk, backend data-quality/multi-timeframe/Confused state, and real business time. Resolve executionSuggestion only through selectedDecision to an exact persisted ExecutionPlan relation. Keep positions sourced from owner-scoped UserPosition reads; selectedSymbol may not infer or select a UserPosition.

current_implementation_gap: |
  P1B-1 projection separation is effective on merged main. Asset Card source truth, exact plan identity, owner-scoped complete Top3, six-state handling, retry/stale clearing, visual evidence, and real scenarios remain incomplete. This package resolves the product-contract ambiguity and authorizes, but does not implement, that bounded core-data work.

