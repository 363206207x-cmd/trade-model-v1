product_contract_mapping: |
  The sole v4.1 Product Source remains unchanged. Section 15.2 permits Telegram only as a delivery channel for three high-value Message categories. Message remains the sole business fact and Push Recheck remains non-trading revalidation.

design_interaction_mapping: |
  No design implementation is authorized. The successor reuses Message Center, Push Recheck, Position Detail and My/Settings routes. Canonical Figma, Desktop and Mobile remain unchanged.

data_source_mapping: |
  Reuse MessageDO/MessageFactService, ChannelDeliveryDO/ChannelDeliveryService, PushSnapshot/PushRecheck, Opportunity/FinalExecutionPlan, UserPosition/PositionMonitorLog and PersonalUser/UserConfig. Telegram introduces one protocol client only.

current_implementation_gap: |
  The exact package is not authorized. Existing ChannelDelivery records only simple queued/suppressed state and lacks Telegram protocol delivery, durable retry, readiness, qualification wiring and secure status projection.

