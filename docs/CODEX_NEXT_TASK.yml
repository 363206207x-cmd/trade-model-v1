product_contract_mapping: |
  Apply the formal Home rule that ExecutionPlan is the selected asset's system suggestion while Position Monitor is the owner-scoped read model for a manual UserPosition. Both projections remain visible and independent; neither creates a trade or position mutation.

design_interaction_mapping: |
  Preserve the five primary tabs, final Home module order, context-only focus-asset click, linked ExecutionPlan and exactly three AI summaries, independent Top3 positions, explicit detail links, and distinct READY/PARTIAL/EMPTY/ERROR/MISSING behavior. This authorization task does not edit UI or Figma.

data_source_mapping: |
  Keep executionSuggestion sourced from selectedDecision plus the existing asset ExecutionPlan projection. Keep positions sourced from owner-scoped UserPosition reads. selectedSymbol may scope asset state, plan, AI, and consistency only; it may not infer or select a UserPosition.

